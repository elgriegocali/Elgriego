/* ---------- RECETAS ---------- */
function costeoRecetas(){
  var keys=Object.keys(RECETAS);

  /* alta */
  var ingKeys=ingredientesOrdenados();
  var nueva=el('<div class="card"><h2>Nueva receta</h2>'
    +'<label class="f">Nombre</label><input class="f" data-n placeholder="ej. Relleno de Spanakopitakia">'
    +'<label class="f">Ingrediente base</label><select class="f" data-base>'
      +ingKeys.map(function(ik){ return '<option value="'+ik+'">'+esc(INGREDIENTES[ik].n)+'</option>'; }).join('')
    +'</select>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'
    +'<div><label class="f">Gramos del lote</label><input class="f" type="number" step="any" data-bg placeholder="1000"></div>'
    +'<div><label class="f">Rendimiento</label><input class="f" type="number" step="0.001" data-f value="1"></div>'
    +'</div>'
    +'<div class="muted small" style="margin:6px 0">El rendimiento es 1 si no hay pérdida; 0.588 si de 1.000 g crudos salen 588 g servidos. Los demás ingredientes se agregan después, tocando la receta.</div>'
    +'<button class="btn primario" data-add>Crear receta</button>'
    +'<div class="muted small" data-msg style="margin-top:6px"></div></div>');
  nueva.querySelector('[data-add]').addEventListener('click', function(){
    var nombre=(nueva.querySelector('[data-n]').value||'').trim();
    var base=nueva.querySelector('[data-base]').value;
    var bg=num(nueva.querySelector('[data-bg]').value);
    var f=num(nueva.querySelector('[data-f]').value)||1;
    var msg=nueva.querySelector('[data-msg]');
    if(!nombre){ msg.textContent='Ponle un nombre.'; return; }
    if(!bg){ msg.textContent='Dime cuántos gramos del ingrediente base lleva el lote.'; return; }
    var k=slugKey(nombre, RECETAS, 'r_');
    RECETAS[k]={k:k, n:nombre, base:base, baseG:bg, factor:f, lineas:[[base,1]]};
    costeoAbierto['r'+k]=true; costeoAbierto['e'+k]=true;
    guardarYRefrescar();
  });
  main.appendChild(nueva);

  var card=el('<div class="card"><h2>Recetas ('+keys.length+')</h2>'
    +'<div class="muted small" style="margin-bottom:8px">Cada receta se define como proporciones sobre un ingrediente base. El <b>rendimiento</b> convierte el peso crudo en peso servido (cocción, horneado).</div></div>');

  keys.forEach(function(k){
    var rc=recetaCalc(k); if(!rc) return;
    var ab=!!costeoAbierto['r'+k];
    var wrap=el('<div style="border-bottom:1px dashed var(--linea);padding:8px 0"></div>');
    var top=el('<div class="row" style="cursor:pointer">'
      +'<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(rc.r.n)+' <span class="muted small">'+(ab?'▾':'▸')+'</span></div>'
      +'<div class="muted small">lote '+g(rc.crudo)+' crudo'
        +(rc.factor!==1 ? ' → '+g(rc.final)+' servido ('+Math.round((1-rc.factor)*100)+'% pérdida)' : '')
      +'</div></div>'
      +'<div style="text-align:right"><div class="money">'+rc.copGFinal.toFixed(2)+'</div>'
      +'<div class="muted small">COP/g servido</div></div></div>');
    top.addEventListener('click', function(){ costeoAbierto['r'+k]=!ab; render('costeo'); });
    wrap.appendChild(top);

    if(ab){
      var det=el('<div style="padding:6px 0 0"></div>');
      if(rc.r.nota) det.appendChild(el('<div class="banner" style="margin-bottom:6px">'+esc(rc.r.nota)+'</div>'));
      if(rc.r.alerta) det.appendChild(el('<div class="aviso" style="margin-bottom:6px">'+esc(rc.r.alerta)+'</div>'));

      if(!rc.lineas.length){
        det.appendChild(el('<div class="muted small">Todavía no tiene ingredientes. Ábrela con “Editar receta”.</div>'));
      }
      rc.lineas.forEach(function(l){
        var pct=rc.costo? l.costo/rc.costo*100 : 0;
        det.appendChild(el('<div class="row" style="padding:3px 0">'
          +'<div style="flex:1;min-width:0"><div class="small">'+esc(l.ing.n)+'</div>'
          +'<div class="bar"><i style="width:'+Math.min(100,pct).toFixed(1)+'%"></i></div></div>'
          +'<div style="text-align:right;min-width:96px">'
          +'<div class="small money">'+fmt(l.costo)+'</div>'
          +'<div class="muted small">'+g(l.g)+' · '+pct.toFixed(0)+'%</div></div></div>'));
      });
      det.appendChild(el('<hr class="s"/><div class="row"><b class="small">Costo del lote</b>'
        +'<b class="money">'+fmt(rc.costo)+'</b></div>'));

      var edAb=!!costeoAbierto['e'+k];
      var btnEd=el('<button class="btn fant" style="width:100%;margin-top:6px">'+(edAb?'Cerrar edición':'Editar receta')+'</button>');
      btnEd.addEventListener('click', function(){ costeoAbierto['e'+k]=!edAb; render('costeo'); });
      det.appendChild(btnEd);
      if(edAb) det.appendChild(bloqueEditarReceta(k));
      wrap.appendChild(det);
    }
    card.appendChild(wrap);
  });
  main.appendChild(card);
}

/* Editor de una receta: nombre, base, rendimiento y las líneas en gramos.
   Se escribe en gramos y la app deriva el ratio — pensar en ratios es
   antinatural al armar una receta desde cero. */
function bloqueEditarReceta(k){
  var r=RECETAS[k];
  var baseG=num(r.baseG)||1;
  var wrap=el('<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--linea)"></div>');

  wrap.appendChild(el('<label class="f">Nombre</label>'));
  var inN=el('<input class="f" value="'+esc(r.n)+'">'); wrap.appendChild(inN);

  var grid=el('<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div>');
  grid.appendChild(el('<div><label class="f">Ingrediente base</label></div>'));
  grid.appendChild(el('<div><label class="f">Rendimiento</label></div>'));
  wrap.appendChild(grid);
  var fila2=el('<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div>');
  var selBase=el('<select class="f"></select>');
  (r.lineas||[]).forEach(function(l){
    var i=INGREDIENTES[l[0]]; if(!i) return;
    selBase.appendChild(el('<option value="'+l[0]+'"'+(l[0]===r.base?' selected':'')+'>'+esc(i.n)+'</option>'));
  });
  var inF=el('<input class="f" type="number" step="0.001" value="'+(num(r.factor)||1)+'">');
  fila2.appendChild(selBase); fila2.appendChild(inF);
  wrap.appendChild(fila2);

  wrap.appendChild(el('<label class="f">Ingredientes del lote (gramos)</label>'));
  var lista=el('<div></div>');
  var origen=[];
  (r.lineas||[]).forEach(function(l, idx){
    var i=INGREDIENTES[l[0]];
    var gr=nEdit(baseG*num(l[1]));
    origen.push(gr);
    var fila=el('<div style="display:flex;align-items:center;gap:6px;padding:3px 0"></div>');
    fila.appendChild(el('<div class="small" style="flex:1;min-width:0">'+esc(i?i.n:l[0])
      +(l[0]===r.base?' <span class="muted">(base)</span>':'')+'</div>'));
    var inp=el('<input class="f" type="number" step="any" style="width:92px;font-size:14px" value="'+gr+'">');
    inp.setAttribute('data-linea', idx);
    fila.appendChild(inp);
    var x=el('<button class="btn fant" style="padding:4px 7px">×</button>');
    x.addEventListener('click', function(){
      if(l[0]===r.base){ alert('No se puede quitar el ingrediente base. Cambia primero la base a otro ingrediente.'); return; }
      r.lineas.splice(idx,1);
      guardarYRefrescar();
    });
    fila.appendChild(x);
    lista.appendChild(fila);
  });
  wrap.appendChild(lista);

  /* agregar ingrediente */
  var usados={}; (r.lineas||[]).forEach(function(l){ usados[l[0]]=true; });
  var disp=ingredientesOrdenados().filter(function(ik){ return !usados[ik]; });
  if(disp.length){
    var add=el('<div style="display:flex;gap:6px;margin-top:8px"></div>');
    var selAdd=el('<select class="f" style="flex:1">'
      +disp.map(function(ik){ return '<option value="'+ik+'">'+esc(INGREDIENTES[ik].n)+'</option>'; }).join('')
      +'</select>');
    var gAdd=el('<input class="f" type="number" step="any" placeholder="g" style="width:78px">');
    var bAdd=el('<button class="btn oliva" style="padding:9px 12px">+</button>');
    bAdd.addEventListener('click', function(){
      var gr=num(gAdd.value);
      if(!gr){ alert('¿Cuántos gramos de '+INGREDIENTES[selAdd.value].n+' lleva el lote?'); return; }
      r.lineas.push([selAdd.value, gr/(num(r.baseG)||1)]);
      guardarYRefrescar();
    });
    add.appendChild(selAdd); add.appendChild(gAdd); add.appendChild(bAdd);
    wrap.appendChild(add);
  }

  wrap.appendChild(el('<div class="muted small" style="margin-top:8px">Cambiar los gramos del ingrediente base escala todo el lote; cambiar cualquier otro cambia solo su proporción.</div>'));

  var acciones=el('<div style="display:flex;gap:8px;margin-top:8px"></div>');
  var save=el('<button class="btn oliva" style="flex:1">Guardar receta</button>');
  save.addEventListener('click', function(){
    var nombre=(inN.value||'').trim();
    if(!nombre){ alert('El nombre no puede quedar vacío.'); return; }
    r.n=nombre;
    r.factor=num(inF.value)||1;

    var inputs=lista.querySelectorAll('input[data-linea]');
    var nuevoBaseG=num(r.baseG);
    for(var q=0;q<inputs.length;q++){
      var ix=parseInt(inputs[q].getAttribute('data-linea'),10);
      if(r.lineas[ix][0]===r.base) nuevoBaseG=num(inputs[q].value)||nuevoBaseG;
    }
    /* solo se recalcula el ratio de las líneas que el usuario tocó; las demás
       conservan su proporción y escalan con el lote */
    for(var w=0;w<inputs.length;w++){
      var iy=parseInt(inputs[w].getAttribute('data-linea'),10);
      var val=num(inputs[w].value);
      if(r.lineas[iy][0]===r.base){ r.lineas[iy][1]=1; continue; }
      if(Math.abs(val-origen[iy])>0.0005) r.lineas[iy][1]=val/nuevoBaseG;
    }
    r.baseG=nuevoBaseG;

    var nuevaBase=selBase.value;
    if(nuevaBase!==r.base){
      /* mantener los gramos absolutos y recalcular todo contra la nueva base */
      var gramos={};
      r.lineas.forEach(function(l){ gramos[l[0]]=nuevoBaseG*num(l[1]); });
      var gb=gramos[nuevaBase]||0;
      if(!gb){ alert('Esa base no tiene gramos asignados.'); return; }
      r.base=nuevaBase; r.baseG=gb;
      r.lineas.forEach(function(l){ l[1]=gramos[l[0]]/gb; });
    }
    guardarYRefrescar();
  });
  var del=el('<button class="btn fant">Eliminar</button>');
  del.addEventListener('click', function(){
    var uso=productosQueUsan(k);
    if(uso.length){ alert('No se puede eliminar: la usan '+uso.join(', ')+'. Quítala de esos productos primero.'); return; }
    if(!confirm('¿Eliminar la receta '+r.n+'?')) return;
    delete RECETAS[k];
    guardarYRefrescar();
  });
  acciones.appendChild(save); acciones.appendChild(del);
  wrap.appendChild(acciones);
  return wrap;
}

/* ---------- PRODUCTOS ---------- */
function costeoProductos(){
  var card=el('<div class="card"><h2>Productos armados</h2>'
    +'<div class="muted small" style="margin-bottom:8px">Cada producto se arma con porciones de receta. Cada porción se mide en <b>gramos del ingrediente base</b> (150 g de carne) o en <b>gramos ya preparados</b> (90 g de pan) — el selector de al lado lo define.</div></div>');

  var sinArmar=PRODUCTOS.filter(function(p){ return !ENSAMBLES[p.key]; });

  PRODUCTOS.forEach(function(p){
    var c=productoCalc(p.key); if(!c) return;
    var ab=!!costeoAbierto['p'+p.key];
    var wrap=el('<div style="border-bottom:1px dashed var(--linea);padding:8px 0"></div>');
    var top=el('<div class="row" style="cursor:pointer">'
      +'<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(p.nombre)+' <span class="muted small">'+(ab?'▾':'▸')+'</span></div>'
      +'<div class="muted small">'+fmt(p.precio)+' · '+esc(p.unidad)+'</div>'
      +'<div style="margin-top:3px">'+chipFC(c.fc)+'</div></div>'
      +'<div style="text-align:right"><div class="money">'+fmt(c.total)+'</div>'
      +'<div class="muted small">costo total</div></div></div>');
    top.addEventListener('click', function(){ costeoAbierto['p'+p.key]=!ab; render('costeo'); });
    wrap.appendChild(top);

    if(ab){
      var det=el('<div style="padding:6px 0 0"></div>');
      if(c.e.alerta) det.appendChild(el('<div class="aviso" style="margin-bottom:6px">'+esc(c.e.alerta)+'</div>'));
      if(c.e.nota)   det.appendChild(el('<div class="banner" style="margin-bottom:6px">'+esc(c.e.nota)+'</div>'));

      c.det.forEach(function(d){
        var comoTxt = d.g==null ? '' :
          ' <span class="muted">'+g(d.g)+(d.modo==='base' ? ' de '+esc(d.base||'base') : ' servidos')+'</span>';
        det.appendChild(el('<div class="row" style="padding:3px 0"><div class="small">'+esc(d.nombre)
          +comoTxt+'</div>'
          +'<div class="small money">'+fmt(d.costo)+'</div></div>'));
      });
      if(c.merma) det.appendChild(el('<div class="row" style="padding:3px 0"><div class="small muted">Merma '+num(CFG.merma)+'%</div>'
        +'<div class="small money">'+fmt(c.merma)+'</div></div>'));
      det.appendChild(el('<div class="row" style="padding:3px 0"><b class="small">Ingredientes</b>'
        +'<b class="money">'+fmt(c.ingT)+'</b></div>'));
      [['Empaque',c.empaque],['Gas',c.gas],['Mano de obra',c.labor]].forEach(function(x){
        if(!x[1]) return;
        det.appendChild(el('<div class="row" style="padding:3px 0"><div class="small muted">'+x[0]+'</div>'
          +'<div class="small money">'+fmt(x[1])+'</div></div>'));
      });
      det.appendChild(el('<hr class="s"/>'
        +'<div class="row"><b class="small">Costo total</b><b class="money">'+fmt(c.total)+'</b></div>'
        +'<div class="row"><b class="small">Margen</b><b class="money" style="color:'+(c.margen>0?'var(--oliva-osc)':'var(--rojo)')+'">'
        +fmt(c.margen)+' ('+c.margenPct.toFixed(0)+'%)</b></div>'));

      /* editar porciones */
      if(c.fijo){
        var conv=el('<button class="btn fant" style="width:100%;margin-top:8px">Costear por receta en vez de a mano</button>');
        conv.addEventListener('click', function(){
          if(!confirm('Se borra el costo cargado a mano ('+fmt(c.e.costoFijo)+') y el producto pasa a costearse con recetas. ¿Seguir?')) return;
          delete c.e.costoFijo; c.e.comp=[];
          guardarYRefrescar();
        });
        det.appendChild(conv);
      } else {
        var eds=el('<div style="margin-top:8px"></div>');
        (c.e.comp||[]).forEach(function(comp, idx){
          var r=RECETAS[comp[0]];
          var modo=comp[2]||'servido';
          var baseN=(r && INGREDIENTES[r.base]) ? INGREDIENTES[r.base].n : 'ingrediente base';
          eds.appendChild(el('<label class="f">'+esc(r?r.n:comp[0])+'</label>'));
          var fila=el('<div style="display:flex;gap:6px"></div>');
          var inp=el('<input class="f" type="number" step="any" value="'+num(comp[1])+'" style="flex:1">');
          inp.setAttribute('data-idx', idx);
          var sel=el('<select class="f" style="flex:1.4">'
            +'<option value="base"'+(modo==='base'?' selected':'')+'>g de '+esc(baseN)+'</option>'
            +'<option value="servido"'+(modo!=='base'?' selected':'')+'>g ya preparados</option></select>');
          sel.setAttribute('data-modo', idx);
          var quitar=el('<button class="btn fant" style="padding:4px 7px">×</button>');
          quitar.addEventListener('click', function(){
            c.e.comp.splice(idx,1);
            guardarYRefrescar();
          });
          fila.appendChild(inp); fila.appendChild(sel); fila.appendChild(quitar);
          eds.appendChild(fila);
        });

        /* agregar componente */
        var usadas={}; (c.e.comp||[]).forEach(function(x){ usadas[x[0]]=true; });
        var libres=Object.keys(RECETAS).filter(function(rk){ return !usadas[rk]; });
        if(libres.length){
          eds.appendChild(el('<label class="f">Agregar receta</label>'));
          var addRow=el('<div style="display:flex;gap:6px"></div>');
          var selR=el('<select class="f" style="flex:1">'
            +libres.map(function(rk){ return '<option value="'+rk+'">'+esc(RECETAS[rk].n)+'</option>'; }).join('')
            +'</select>');
          var gR=el('<input class="f" type="number" step="any" placeholder="g" style="width:78px">');
          var bR=el('<button class="btn oliva" style="padding:9px 12px">+</button>');
          bR.addEventListener('click', function(){
            var gr=num(gR.value);
            if(!gr){ alert('¿Cuántos gramos de '+RECETAS[selR.value].n+' lleva el producto?'); return; }
            if(!c.e.comp) c.e.comp=[];
            c.e.comp.push([selR.value, gr, 'servido']);
            guardarYRefrescar();
          });
          addRow.appendChild(selR); addRow.appendChild(gR); addRow.appendChild(bR);
          eds.appendChild(addRow);
        }
        det.appendChild(eds);
      }
      var extra=el('<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px">'
        +'<div><label class="f">Empaque</label><input class="f" type="number" step="50" data-emp value="'+c.empaque+'"></div>'
        +'<div><label class="f">Gas</label><input class="f" type="number" step="50" data-gas value="'+c.gas+'"></div>'
        +'<div><label class="f">M. obra</label><input class="f" type="number" step="50" data-lab value="'+c.labor+'"></div></div>');
      det.appendChild(extra);

      var save=el('<button class="btn oliva" style="width:100%;margin-top:8px">Guardar producto</button>');
      save.addEventListener('click', function(){
        if(!c.fijo && c.e.comp){
          var inputs=det.querySelectorAll('input[data-idx]');
          for(var q=0;q<inputs.length;q++){
            var ix=parseInt(inputs[q].getAttribute('data-idx'),10);
            c.e.comp[ix][1]=num(inputs[q].value);
          }
          var sels=det.querySelectorAll('select[data-modo]');
          for(var w=0;w<sels.length;w++){
            var iy=parseInt(sels[w].getAttribute('data-modo'),10);
            c.e.comp[iy][2]=sels[w].value;
          }
        }
        c.e.empaque=num(extra.querySelector('[data-emp]').value);
        c.e.gas=num(extra.querySelector('[data-gas]').value);
        c.e.labor=num(extra.querySelector('[data-lab]').value);
        guardarRecetas(); aplicarCosteoRecetas(); render('costeo');
      });
      det.appendChild(save);
      wrap.appendChild(det);
    }
    card.appendChild(wrap);
  });
  main.appendChild(card);

  if(sinArmar.length){
    var cs=el('<div class="card"><h2>Sin costear ('+sinArmar.length+')</h2>'
      +'<div class="muted small" style="margin-bottom:8px">Estos productos todavía no se arman con recetas. Crea el costeo y luego agrégales las recetas que lleven.</div></div>');
    sinArmar.forEach(function(p){
      var fila=el('<div class="item-row">'
        +'<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(p.nombre)+'</div>'
        +'<div class="muted small">'+fmt(p.precio)+' · '+esc(p.unidad)+'</div></div></div>');
      var b=el('<button class="btn fant" style="padding:4px 8px;font-size:11px">Crear costeo</button>');
      b.addEventListener('click', function(){
        ENSAMBLES[p.key]={comp:[]};
        costeoAbierto['p'+p.key]=true;
        guardarYRefrescar();
      });
      fila.appendChild(b);
      cs.appendChild(fila);
    });
    main.appendChild(cs);
  }
}

/* ---------- LISTA DE COMPRAS ---------- */
var comprasSel={};
var comprasMan={};                 /* cantidades manuales, sobreviven al re-render */
var comprasModo='producto';        /* 'producto' | 'insumo' */

function costeoCompras(){
  var activos=pedidos.filter(function(p){
    return p.estado!=='Entregado' && p.estado!=='Cancelado';
  });

  var card=el('<div class="card"><h2>Lista de compras</h2>'
    +'<div class="muted small" style="margin-bottom:8px">Suma los ingredientes crudos de los pedidos activos. Marca los que quieras incluir.</div></div>');

  if(activos.length===0){
    card.appendChild(el('<div class="muted small">No hay pedidos activos. Usa el cálculo manual de abajo.</div>'));
  } else {
    activos.forEach(function(p){
      var on = comprasSel[p.id]!==false;
      var b=el('<div class="row" style="cursor:pointer;padding:6px 0;border-bottom:1px dashed var(--linea)">'
        +'<div style="flex:1;min-width:0"><div class="small" style="font-weight:700">'
        +(on?'☑':'☐')+' '+esc(p.cliente||'Sin nombre')+'</div>'
        +'<div class="muted small">'+esc(p.fecha)+' · '+esc(p.estado)+'</div></div></div>');
      b.addEventListener('click', function(){ comprasSel[p.id]=!on; render('costeo'); });
      card.appendChild(b);
    });
  }
  main.appendChild(card);

  /* cantidades manuales */
  var man=el('<div class="card"><h2>Agregar a mano</h2>'
    +'<div class="muted small" style="margin-bottom:6px">Para producción sin pedido — por ejemplo un lote para congelar.</div></div>');
  PRODUCTOS.forEach(function(p){
    if(!ENSAMBLES[p.key] || ENSAMBLES[p.key].costoFijo!=null) return;
    if(comprasMan[p.key]==null) comprasMan[p.key]=0;
    var row=el('<div class="item-row"><div style="flex:1"><div class="small">'+esc(p.nombre)+'</div></div>'
      +'<div class="qty"><button data-m>−</button><span>'+comprasMan[p.key]+'</span><button data-p>+</button></div></div>');
    var span=row.querySelector('span');
    row.querySelector('[data-m]').addEventListener('click', function(){
      if(comprasMan[p.key]>0){ comprasMan[p.key]--; span.textContent=comprasMan[p.key]; recalc(); }
    });
    row.querySelector('[data-p]').addEventListener('click', function(){
      comprasMan[p.key]++; span.textContent=comprasMan[p.key]; recalc();
    });
    man.appendChild(row);
  });
  main.appendChild(man);

  var out=el('<div class="card"><h2>Ingredientes a comprar</h2></div>');
  var toggle=el('<div class="pills" style="margin:0 0 4px"></div>');
  [['producto','Por producto'],['insumo','Por insumo']].forEach(function(v){
    var b=el('<button class="pill'+(comprasModo===v[0]?' on':'')+'">'+v[1]+'</button>');
    b.addEventListener('click', function(){ comprasModo=v[0]; recalc(); render('costeo'); });
    toggle.appendChild(b);
  });
  out.appendChild(toggle);
  out.appendChild(el('<div class="muted small" style="margin-bottom:6px">'
    +(comprasModo==='producto'
      ? 'Cuánto insumo se va en cada plato — para la mise en place.'
      : 'Todo sumado por ingrediente — para ir al mercado.')+'</div>'));
  out.appendChild(el('<div id="lc-body"></div>'));
  main.appendChild(out);

  /* unidades por producto: pedidos marcados + cantidades manuales */
  function cantidades(){
    var cant={};
    activos.forEach(function(p){
      if(comprasSel[p.id]===false) return;
      (p.items||[]).forEach(function(it){
        if(!prod(it.key)) return;
        cant[it.key]=(cant[it.key]||0)+(it.qty||0);
      });
    });
    for(var pk in comprasMan){ if(comprasMan[pk]>0) cant[pk]=(cant[pk]||0)+comprasMan[pk]; }
    return cant;
  }
  function costoDe(mapa){
    var s=0; for(var k in mapa) s+=mapa[k]*copG(INGREDIENTES[k]);
    return s;
  }
  function filasIng(mapa, contenedor){
    Object.keys(mapa).filter(function(k){ return mapa[k]>0.005; })
      .sort(function(a,b){ return mapa[b]*copG(INGREDIENTES[b])-mapa[a]*copG(INGREDIENTES[a]); })
      .forEach(function(k){
        var i=INGREDIENTES[k];
        contenedor.appendChild(el('<div class="row" style="padding:3px 0">'
          +'<div class="small" style="flex:1">'+esc(i.n)+'</div>'
          +'<div style="text-align:right"><div class="small money">'+g(mapa[k])+'</div>'
          +'<div class="muted small">'+fmt(mapa[k]*copG(i))+'</div></div></div>'));
      });
  }
  function total(txt, valor){
    return el('<div class="row" style="margin-top:8px;padding-top:6px;border-top:1px solid var(--linea)">'
      +'<b class="small">'+txt+'</b><b class="money">'+fmt(valor)+'</b></div>');
  }

  function recalc(){
    var cant=cantidades();
    var body=out.querySelector('#lc-body');
    body.innerHTML='';
    var pks=Object.keys(cant).filter(function(k){ return cant[k]>0; });
    if(!pks.length){
      body.appendChild(el('<div class="muted small">Nada seleccionado todavía.</div>'));
      return;
    }

    if(comprasModo==='producto'){
      var suma=0, sinReceta=0;
      pks.map(function(pk){
        var mapa=ingredientesDe(pk, cant[pk]);
        return {pk:pk, qty:cant[pk], mapa:mapa, costo:costoDe(mapa)};
      })
      .sort(function(a,b){ return b.costo-a.costo; })
      .forEach(function(x){
        suma+=x.costo;
        var bloque=el('<div style="padding:8px 0;border-bottom:1px dashed var(--linea)"></div>');
        bloque.appendChild(el('<div class="row"><b class="small">'+esc(prod(x.pk).nombre)+' × '+x.qty+'</b>'
          +'<b class="money">'+fmt(x.costo)+'</b></div>'));
        if(!Object.keys(x.mapa).length){
          sinReceta++;
          bloque.appendChild(el('<div class="muted small">Sin receta cargada — no se puede desglosar.</div>'));
        } else {
          var det=el('<div style="margin-top:4px;padding-left:10px;border-left:2px solid var(--linea)"></div>');
          filasIng(x.mapa, det);
          bloque.appendChild(det);
        }
        body.appendChild(bloque);
      });
      body.appendChild(total('Total insumos', suma));
      if(sinReceta) body.appendChild(el('<div class="aviso" style="margin-top:6px">'+sinReceta
        +' producto(s) sin receta no entran en el total.</div>'));
    } else {
      var acum={};
      pks.forEach(function(pk){
        var sub=ingredientesDe(pk, cant[pk]);
        for(var k in sub) acum[k]=(acum[k]||0)+sub[k];
      });
      filasIng(acum, body);
      body.appendChild(total('Total insumos', costoDe(acum)));
    }
  }
  recalc();
}

/* ================= INICIO ================= */
cargarPedidos(function(d){
  pedidos=d;
  cargarCosteos(function(costeos){
    aplicarCosteos(costeos);
    cargarRecetas(function(rec){
      costeoCargarModelo(rec);
      if(!rec || costeoMigrado) guardarRecetas();   /* primera vez, o modelo recién migrado */
      aplicarCosteoRecetas();         /* el FC por receta manda sobre el manual */
      render('hoy');
    });
  });
});
