<title>El Griego Cali</title>
<style>
:root{
  --azul:#2742D8; --azul-osc:#16245F; --cielo:#8FD0E8;
  --marmol:#F6F5F0; --carta:#FFFFFF; --tinta:#1A2238; --gris:#6B7280;
  --oliva:#76814B; --oliva-osc:#4F5A2E; --oliva-suave:#EEF0E2;
  --oro:#C9920E; --oro-suave:#FBF3DC;
  --rojo:#C04A3A; --rojo-suave:#FBE9E5;
  --azul-suave:#E8ECFC; --linea:#E5E3DB;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;background:var(--marmol);color:var(--tinta);font-size:15px;line-height:1.45}
.shell{max-width:520px;margin:0 auto;width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--marmol)}
.header{background:var(--azul);color:#fff;padding:16px 16px 12px}
.header h1{font-size:22px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;font-weight:700}
.header .sub{font-size:11px;opacity:.85;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.eye{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 50% 50%, #14213D 0 22%, #fff 22% 42%, var(--cielo) 42% 72%, #fff 72% 100%);flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.greca{height:8px;background:repeating-linear-gradient(90deg,var(--azul) 0 4px,transparent 4px 8px),repeating-linear-gradient(0deg,var(--azul) 0 2px,transparent 2px 5px),var(--cielo);border-bottom:1px solid var(--linea)}
.main{flex:1;padding:12px 12px 20px;display:flex;flex-direction:column;gap:12px}
.tabbar{position:sticky;bottom:0;z-index:30;background:var(--carta);border-top:1px solid var(--linea);display:flex;box-shadow:0 -4px 16px rgba(20,33,61,.06);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:none;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--gris);padding:8px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-transform:uppercase;font-family:inherit}
.tabbar button .ic{font-size:16px;line-height:1}
.tabbar button.on{color:var(--azul)}
.tabbar button.on::after{content:"";width:14px;height:2px;border-radius:2px;background:var(--oliva)}
.card{background:var(--carta);border:1px solid var(--linea);border-radius:12px;padding:12px}
.card h2{font-size:15px;font-weight:800;margin-bottom:8px;color:var(--azul-osc)}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:var(--carta);border:1px solid var(--linea);border-radius:12px;padding:10px 8px;text-align:center}
.kpi .lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.kpi .val{font-size:18px;margin-top:3px;font-weight:800;color:var(--azul-osc);font-variant-numeric:tabular-nums}
.kpi.oliva .val{color:var(--oliva-osc)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.muted{color:var(--gris);font-size:13px}
.money{font-variant-numeric:tabular-nums;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;text-transform:uppercase}
.chip.estrella{background:var(--oro-suave);color:var(--oro)}
.chip.caballo{background:var(--azul-suave);color:var(--azul)}
.chip.rompe{background:var(--oliva-suave);color:var(--oliva-osc)}
.chip.neutro{background:#EFEFEA;color:var(--gris)}
.chip.ok{background:var(--oliva-suave);color:var(--oliva-osc)}
.chip.warn{background:var(--oro-suave);color:var(--oro)}
.chip.alerta{background:var(--rojo-suave);color:var(--rojo)}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.pill{border:1px solid var(--linea);background:var(--carta);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;color:var(--gris);cursor:pointer;font-family:inherit}
.pill.on{background:var(--azul);border-color:var(--azul);color:#fff}
label.f{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin:8px 0 3px}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--linea);border-radius:9px;padding:9px 10px;font-family:inherit;font-size:16px;background:#fff;color:var(--tinta)}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--cielo);border-color:var(--azul)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:none;border-radius:10px;padding:11px 14px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;letter-spacing:.02em;text-decoration:none}
.btn.primario{background:var(--azul);color:#fff;width:100%}
.btn.oliva{background:var(--oliva);color:#fff}
.btn.fant{background:transparent;color:var(--rojo);padding:6px 8px;font-size:11px}
.btn.wa{background:#1FAF54;color:#fff;padding:7px 11px;font-size:11px;border-radius:8px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--linea);background:#fff;font-size:16px;font-weight:800;color:var(--azul);cursor:pointer}
.qty span{min-width:18px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--linea);gap:8px}
.item-row:last-child{border-bottom:none}
.bar{height:6px;border-radius:5px;background:#ECEBE4;overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--azul)}
.bar>i.oliva{background:var(--oliva)}
.pedido{border-left:3px solid var(--azul)}
.pedido.entregado{border-left-color:var(--oliva)}
.pedido.cancelado{border-left-color:var(--rojo);opacity:.7}
.banner{background:var(--oliva-suave);border:1px solid #D8DCC2;color:var(--oliva-osc);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700}
.aviso{background:var(--oro-suave);border:1px solid #EAD9A8;color:var(--oro);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700}
.vacio{text-align:center;padding:28px 12px;color:var(--gris)}
.vacio .eye{margin:0 auto 8px;width:26px;height:26px}
.small{font-size:12px}
hr.s{border:none;border-top:1px dashed var(--linea);margin:8px 0}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <h1><span class="eye"></span>EL GRIEGO</h1>
    <div class="sub">Auténtica cocina griega · Cali</div>
    <div class="sub" id="modo" style="margin-top:4px;text-transform:none;letter-spacing:.02em"></div>
  </header>
  <div class="greca"></div>
  <div class="main" id="main"><div class="vacio">Cargando…</div></div>
  <nav class="tabbar" id="tabbar">
    <button data-tab="hoy"><span class="ic">◉</span>Hoy</button>
    <button data-tab="pedidos"><span class="ic">▤</span>Pedidos</button>
    <button data-tab="nuevo"><span class="ic">＋</span>Nuevo</button>
    <button data-tab="menu"><span class="ic">✦</span>Menú</button>
    <button data-tab="costeo"><span class="ic">◈</span>Costeo</button>
    <button data-tab="clientes"><span class="ic">♥</span>Clientes</button>
  </nav>
</div>

<script src="precios.js"></script>
<script src="menus.js"></script>
<script>
/* ================= DATOS ================= */
var PRODUCTOS = [
 {key:'gyros_cerdo',  nombre:'Gyros de Cerdo',        precio:24000, unidad:'por gyro',      fc:15.2, clase:'Estrella'},
 {key:'gyros_pollo',  nombre:'Gyros de Pollo',        precio:24000, unidad:'por gyro',      fc:18.0, clase:'Estrella'},
 {key:'gyros_bondiola',nombre:'Gyros de Bondiola',    precio:24000, unidad:'por gyro',      fc:19.3, clase:'Caballo de batalla', nota:'Solo eventos · mínimo 20 · no está en la carta del cliente'},
 {key:'kebab',        nombre:'Kebab Estilo Thanasis', precio:24000, unidad:'por porción',   fc:19.1, clase:'Rompecabezas', destacar:true},
 {key:'mousaka',      nombre:'Mousaka',               precio:30000, unidad:'350 g',         fc:null},
 {key:'pastitsio',    nombre:'Pastitsio',             precio:30000, unidad:'350 g',         fc:null},
 {key:'spanako',      nombre:'Spanakopitakia',        precio:22000, unidad:'6 empanadas',   fc:null},
 {key:'tiro',         nombre:'Tiropitakia',           precio:22000, unidad:'6 empanadas',   fc:62.2},
 {key:'praso',        nombre:'Prasopitakia',          precio:24000, unidad:'6 pastelitos',  fc:null},
 {key:'ens_griega',   nombre:'Ensalada Griega',       precio:20000, unidad:'250 g',         fc:null},
 {key:'dakos',        nombre:'Ensalada Dakos',        precio:20000, unidad:'250 g',         fc:null},
 {key:'gambas',       nombre:'Gambas Saganaki',       precio:34000, unidad:'250 g',         fc:null, clase:'Ancla de precio'},
 {key:'pita',         nombre:'Pan Pita',              precio:12500, unidad:'5 panes',       fc:20.8, clase:'Caballo de batalla'},
 {key:'tzatziki',     nombre:'Tzatziki',              precio:18000, unidad:'200 g',         fc:22.4, clase:'Caballo de batalla', nota:'Candidato a 20.000'}
];
/* Los precios publicados (precios.js) mandan sobre los que trae esta lista, para
   que la app interna y la carta del cliente no se puedan desincronizar. Si el
   archivo no cargó, se quedan los de arriba y la app sigue funcionando igual. */
var PRECIOS_PUBLICADOS = (typeof PRECIOS!=='undefined' && PRECIOS) ? PRECIOS : null;
if(PRECIOS_PUBLICADOS){
  PRODUCTOS.forEach(function(p){
    var v=PRECIOS_PUBLICADOS[p.key];
    if(v!=null && !isNaN(v) && v>0) p.precio=v;
  });
}
var FC_ESTIMADO = 28;
/* Ventas reales 2026 por mes (unidades) — base histórica de la matriz de ingeniería de menú.
   Los pedidos completados en la app se suman encima, por mes de entrega. */
var VENTAS_MES = {
  '2026-01': {ens_griega:24, gyros_bondiola:8, gyros_cerdo:46, gyros_pollo:22, kebab:26, mousaka:10, pastitsio:2, pita:10, spanako:12, tiro:14, tzatziki:3},
  '2026-02': {ens_griega:6, gambas:1, gyros_bondiola:14, gyros_pollo:13, kebab:13, mousaka:2, pastitsio:2, pita:5, praso:1, spanako:2, tiro:3, tzatziki:2},
  '2026-03': {ens_griega:3, gambas:1, gyros_bondiola:5, gyros_cerdo:13, kebab:15, mousaka:12, pastitsio:3, pita:9, praso:1, spanako:4, tiro:3, tzatziki:2},
  '2026-04': {ens_griega:1, gambas:1, gyros_cerdo:1, gyros_pollo:1, kebab:1, mousaka:12, spanako:3, tiro:2, tzatziki:1},
  '2026-05': {ens_griega:13, gambas:1, gyros_bondiola:5, gyros_cerdo:1, gyros_pollo:9, kebab:5, mousaka:28, pastitsio:1, pita:11, praso:1, spanako:9, tiro:5, tzatziki:12},
  '2026-06': {ens_griega:1, gambas:2, gyros_bondiola:14, gyros_pollo:4, kebab:4, mousaka:14, pastitsio:1, pita:12, praso:1, spanako:2, tzatziki:7}
};
var UMBRAL = 150000;
/* Menús para compartir: presets de cantidades a precio pleno (sin descuento). */
/* Los menús publicados (menus.js) mandan sobre esta lista, para que la app
   interna y la carta del cliente no se puedan desincronizar. Si el archivo no
   cargó, quedan estos y la app sigue funcionando igual. */
var BUNDLES = (typeof MENUS!=='undefined' && MENUS && MENUS.length) ? MENUS : [
 {nombre:'Familiar 1', desc:'2 Gyros · Ensalada Griega · Pan Pita',
  items:[{key:'gyros_cerdo',qty:2},{key:'ens_griega',qty:1},{key:'pita',qty:1}]},
 {nombre:'Familiar 2', desc:'2 Mousaka · Ensalada Griega · Spanakopitakia · Tzatziki · Pan Pita',
  items:[{key:'mousaka',qty:2},{key:'ens_griega',qty:1},{key:'spanako',qty:1},{key:'tzatziki',qty:1},{key:'pita',qty:1}]},
 {nombre:'Familiar 3', desc:'3 Mousaka · 2 Kebab · Ensalada Griega · Spanakopitakia',
  items:[{key:'mousaka',qty:3},{key:'kebab',qty:2},{key:'ens_griega',qty:1},{key:'spanako',qty:1}]}
];
var TIPOS = ['Domicilio','Catering','Pack Congelado'];
var CANALES = ['WhatsApp','Instagram','Rappi','iFood','Referido'];
var ESTADOS = ['Nuevo','Confirmado','En cocina','Despachado','Entregado','Cancelado'];

function fmt(n){ return Math.round(n).toLocaleString('es-CO'); }
function prod(k){ for(var i=0;i<PRODUCTOS.length;i++) if(PRODUCTOS[i].key===k) return PRODUCTOS[i]; return null; }
function fcDe(p){ return p.fc!=null ? p.fc : FC_ESTIMADO; }
/* Clasifica un food cost contra la meta ideal (banda min–max).
   Por debajo o dentro de la banda es 'ok' (más barato nunca es un problema);
   por encima se avisa, y bien por encima se marca en rojo. */
function claseFC(fc){
  var hi=num(CFG.metaMax);
  if(fc<=hi) return 'ok';
  return (fc<=hi*1.25) ? 'warn' : 'alerta';
}
function textoMetaBanda(){ return num(CFG.metaMin)+'\u2013'+num(CFG.metaMax); }
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mesDe(f){ return (f||'').slice(0,7); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* Precio de una línea de pedido: el que quedó sellado al registrarlo.
   Si el pedido es viejo y no lo tiene, se usa el precio de lista actual. */
function precioItem(i){
  if(i && i.precio!=null && !isNaN(i.precio)) return i.precio;
  var p=prod(i.key); return p? p.precio : 0;
}
function calc(items){
  var venta=0, costo=0;
  (items||[]).forEach(function(i){
    var p=prod(i.key); if(!p) return;
    var pr=precioItem(i);
    venta += pr*i.qty;
    costo += pr*i.qty*fcDe(p)/100;
  });
  return {venta:venta, costo:costo, margen:venta-costo, fcPct: venta? costo/venta*100 : 0};
}
/* Lee un valor en pesos escrito a mano: acepta "20.000", "20,000" y "20000". */
function parseCOP(s){
  var d=String(s==null?'':s).replace(/[^\d]/g,'');
  return d? parseInt(d,10) : 0;
}
function waLink(tel, texto){
  var t=(tel||'').replace(/\D/g,''); if(!t) return null;
  if(t.indexOf('57')!==0) t='57'+t;
  return 'https://wa.me/'+t+(texto?('?text='+encodeURIComponent(texto)):'');
}

/* ---- Mensajes al cliente para un pedido ---- */
function nombrePila(p){ return ((p.cliente||'').trim().split(' ')[0]) || ''; }
function saludo(p){ var n=nombrePila(p); return '¡Hola'+(n?' '+n:'')+'! 💙'; }
function totalPedido(p){ return calc(p.items).venta + (p.domicilio||0); }

function msgConfirmar(p){
  var t=calc(p.items);
  var lineas=p.items.map(function(it){ var pr=prod(it.key); return pr? ('• '+it.qty+'× '+pr.nombre+' — '+fmt(precioItem(it)*it.qty)) : ''; }).filter(Boolean).join('\n');
  var msg=saludo(p)+' Gracias por tu pedido en El Griego. Te lo confirmo:\n\n'+lineas+'\n';
  if(p.tipo==='Domicilio'){

/* ============ ALMACENAMIENTO HÍBRIDO ============
   1) window.storage  -> dentro de Claude (persiste en tu cuenta)
   2) localStorage    -> archivo abierto en un navegador / URL propia
   3) memoria         -> último recurso (solo la sesión actual)  */
var memoria = null;
var memoriaCosteos = {};
var memoriaPrecios = {};
var modoGuardado = 'sesion'; // 'claude' | 'dispositivo' | 'sesion'

function localStorageDisponible(){
  try{ localStorage.setItem('__eg_test','1'); localStorage.removeItem('__eg_test'); return true; }
  catch(e){ return false; }
}
function mostrarModo(){
  var m=document.getElementById('modo'); if(!m) return;
  if(modoGuardado==='claude') m.textContent='✓ Datos guardados en Claude';
  else if(modoGuardado==='dispositivo') m.textContent='✓ Datos guardados en este dispositivo';
  else m.textContent='⚠ Sin guardado permanente — usa “Copia de seguridad” en la pestaña Menú';
}
function cargarPedidos(cb){
  if (window.storage && typeof window.storage.get==='function'){
    window.storage.get('elgriego_pedidos').then(function(r){
      var d=[]; try{ if(r && r.value) d=JSON.parse(r.value); }catch(e){}
      modoGuardado='claude'; mostrarModo();
      cb(Array.isArray(d)?d:[]);
    }).catch(function(){
      /* la clave aún no existe — seguimos en Claude */
      modoGuardado='claude'; mostrarModo();
      cb([]);
    });
    return;
  }
  if (localStorageDisponible()){
    modoGuardado='dispositivo'; mostrarModo();
    try{
      var v=localStorage.getItem('elgriego_pedidos');
      cb(v? JSON.parse(v) : []); return;
    }catch(e){ cb([]); return; }
  }
  modoGuardado='sesion'; mostrarModo();
  cb(memoria||[]);
}
function guardarPedidos(d){
  var s=JSON.stringify(d);
  memoria=d;
  if (modoGuardado==='claude' && window.storage && typeof window.storage.set==='function'){
    window.storage.set('elgriego_pedidos', s).catch(function(){});
    return;
  }
  if (modoGuardado==='dispositivo'){
    try{ localStorage.setItem('elgriego_pedidos', s); }catch(e){}
  }
}
function cargarCosteos(cb){
  if (window.storage && typeof window.storage.get==='function'){
    window.storage.get('elgriego_costeos').then(function(r){
      var d={}; try{ if(r && r.value) d=JSON.parse(r.value); }catch(e){}
      cb(d);
    }).catch(function(){ cb({}); });
    return;
  }
  if (localStorageDisponible()){
    try{ var v=localStorage.getItem('elgriego_costeos'); cb(v?JSON.parse(v):{}); return; }catch(e){ cb({}); return; }
  }
  cb(memoriaCosteos);
}
function guardarCosteos(d){
  memoriaCosteos=d;
  if (modoGuardado==='claude' && window.storage && typeof window.storage.set==='function'){
    window.storage.set('elgriego_costeos', JSON.stringify(d)).catch(function(){});
    return;
  }
  if (modoGuardado==='dispositivo'){
    try{ localStorage.setItem('elgriego_costeos', JSON.stringify(d)); }catch(e){}
  }
}
function aplicarCosteos(costeos){
  PRODUCTOS.forEach(function(p){
    if(costeos[p.key]!=null) p.fc=costeos[p.key];
  });
}

/* ---- precios editables desde la app ----
   El precio de lista vive en PRODUCTOS; los cambios se guardan aparte en
   'elgriego_precios' y se aplican encima al arrancar. precioBase guarda el
   precio original del código para poder restablecerlo. */
function cargarPrecios(cb){
  if (window.storage && typeof window.storage.get==='function'){
    window.storage.get('elgriego_precios').then(function(r){
      var d={}; try{ if(r && r.value) d=JSON.parse(r.value); }catch(e){}
      cb(d);
    }).catch(function(){ cb({}); });
    return;
  }
  if (localStorageDisponible()){
    try{ var v=localStorage.getItem('elgriego_precios'); cb(v?JSON.parse(v):{}); return; }catch(e){ cb({}); return; }
  }
  cb(memoriaPrecios);
}
function guardarPrecios(d){
  memoriaPrecios=d;
  if (modoGuardado==='claude' && window.storage && typeof window.storage.set==='function'){
    window.storage.set('elgriego_precios', JSON.stringify(d)).catch(function(){});
    return;
  }
  if (modoGuardado==='dispositivo'){
    try{ localStorage.setItem('elgriego_precios', JSON.stringify(d)); }catch(e){}
  }
}
function aplicarPrecios(precios){
  PRODUCTOS.forEach(function(p){
    if(p.precioBase==null) p.precioBase=p.precio;
    var v=precios && precios[p.key];
    if(v!=null && !isNaN(v) && v>0) p.precio=v;
    else p.precio=p.precioBase;
  });
}
/* Congela el precio de venta dentro de cada pedido ya guardado.
   Los pedidos viejos se registraron con el precio de lista de ese momento,
   que es el que trae el código — por eso se sella antes de aplicar los
   precios editados. Así un cambio de precio nunca altera lo ya facturado. */
function sellarPreciosPedidos(){
  var cambios=false;
  (pedidos||[]).forEach(function(p){
    (p.items||[]).forEach(function(it){
      if(it.precio==null){
        var pr=prod(it.key);
        /* precio de lista del código, no el editado: es el que regía cuando
           se registró el pedido */
        if(pr){ it.precio=(pr.precioBase!=null?pr.precioBase:pr.precio); cambios=true; }
      }
    });
  });
  if(cambios) guardarPedidos(pedidos);
}

function renderHoy(){
  var hoy=hoyISO(), mes=mesDe(hoy);
  var validos=pedidos.filter(function(p){return p.estado!=='Cancelado';});
  var deHoy=validos.filter(function(p){return p.fecha===hoy;});
  var delMes=validos.filter(function(p){return mesDe(p.fecha)===mes;});
  var tHoy=0; deHoy.forEach(function(p){ tHoy+=calc(p.items).venta; });
  var tMes=0,cMes=0; delMes.forEach(function(p){ var c=calc(p.items); tMes+=c.venta; cMes+=c.costo; });
  var pendCobro=validos.filter(function(p){return p.pago!=='Pagado';});
  var enProceso=validos.filter(function(p){return p.estado!=='Entregado';});

  var totalPend=0; pendCobro.forEach(function(p){ totalPend+=calc(p.items).venta+(p.domicilio||0); });
  var pctFC = tMes>0 ? cMes/tMes*100 : 0;

  /* salud de clientes */
  var mapaC={};
  validos.forEach(function(p){
    var k=(p.telefono||p.cliente||'').trim(); if(!k) return;
    if(!mapaC[k]) mapaC[k]={pedidos:0, ultima:p.fecha};
    mapaC[k].pedidos++; if(p.fecha>mapaC[k].ultima) mapaC[k].ultima=p.fecha;
  });
  var frecuentes=0, reactivar=0;
  Object.keys(mapaC).forEach(function(k){
    var c=mapaC[k];
    if(c.pedidos>=3) frecuentes++;
    if(Math.floor((new Date(hoyISO())-new Date(c.ultima))/86400000)>30) reactivar++;
  });

  /* promedio mensual 2026 (unidades históricas × precios actuales) */
  var uBase={};
  Object.keys(VENTAS_MES).forEach(function(m){ var s=VENTAS_MES[m]; for(var k in s) uBase[k]=(uBase[k]||0)+s[k]; });
  var ingresoAnual=0; for(var kb in uBase){ var pb=prod(kb); if(pb) ingresoAnual+=uBase[kb]*pb.precio; }
  var nMeses=Object.keys(VENTAS_MES).length;
  var promMes = nMeses ? ingresoAnual/nMeses : 0;

  /* línea de atención — lo más importante ahora */
  var att, attCls='banner', attTab=null;

    attCls='banner'; attTab='pedidos';

    att='✓ Todo en orden — sin pendientes por cobrar';
  }
  var attEl=el('<div class="'+attCls+'"'+(attTab?' style="cursor:pointer"':'')+'>'+att+'</div>');
  if(attTab) attEl.addEventListener('click', function(){ render(attTab); });
  main.appendChild(attEl);

  var fcChip = claseFC(pctFC);
  var salud=el('<div class="card"><h2>Resumen del negocio</h2>'
    +'<div class="kpis" style="margin-bottom:10px">'

    +'<div class="kpi"><div class="lbl">Por cobrar</div><div class="val">'+fmt(totalPend)+'</div></div>'
    +'</div>'
    +'<div class="row"><span class="muted">Ventas hoy</span><span class="money">'+fmt(tHoy)+'</span></div>'
    +'<hr class="s">'
    +'<div class="row"><span class="muted">Food cost del mes</span>'
      +(tMes>0?'<span class="chip '+fcChip+'">'+pctFC.toFixed(1)+'% · meta '+textoMetaBanda()+'%</span>':'<span class="muted small">sin ventas aún</span>')+'</div>'
    +'<div class="row"><span class="muted">Prom. mensual 2026</span><span class="money">'+fmt(promMes)+'</span></div>'
    +'<div class="row"><span class="muted">En proceso hoy</span><span class="money">'+enProceso.length+'</span></div>'
    +'<hr class="s">'
    +'<div class="row"><span class="muted">Clientes</span><span>'
      +(frecuentes>0?'<span class="chip estrella">'+frecuentes+' frecuente'+(frecuentes>1?'s':'')+'</span> ':'')
      +(reactivar>0?'<span class="chip alerta">'+reactivar+' por reactivar</span>':'')
      +(frecuentes===0&&reactivar===0?'<span class="muted small">se construyen con los pedidos</span>':'')+'</span></div>'

  var filaClientes=salud.querySelectorAll('.row');
  filaClientes[filaClientes.length-1].style.cursor='pointer';
  filaClientes[filaClientes.length-1].addEventListener('click', function(){ render('clientes'); });
  main.appendChild(salud);

     productos que se agreguen ahora entran con el precio de lista de hoy */
  var preciosSellados={};
  (p.items||[]).forEach(function(it){ if(it.precio!=null) preciosSellados[it.key]=it.precio; });

    return Object.keys(editItems).filter(function(k){return editItems[k]>0;})

    var t=calc(listaEdit());
    var gratis=edit.querySelector('[data-dom-gratis]');
    var cobro=edit.querySelector('[data-dom-cobro]');
    if(p.tipo==='Domicilio'){
      var esGratis=t.venta>=UMBRAL;
      gratis.style.display=esGratis?'block':'none';
      cobro.style.display=esGratis?'none':'block';
      if(esGratis) editDom=0;
    } else {
      gratis.style.display='none'; cobro.style.display='none'; editDom=0;
    }
    edit.querySelector('[data-e-total]').textContent=fmt(t.venta+editDom);
  }
  function pintarLista(){
    var cont=edit.querySelector('[data-lista]');
    cont.innerHTML='';
    var keys=Object.keys(editItems).filter(function(k){return editItems[k]>0;});
    if(keys.length===0){
      cont.appendChild(el('<div class="muted small">Sin productos — agrega al menos uno.</div>'));
      return;
    }
    keys.forEach(function(k){
      var pr=prod(k); if(!pr) return;
      var fila=el('<div class="item-row">'
        +'<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(pr.nombre)+'</div>'
        +'<div class="muted small">'+fmt((preciosSellados[k]!=null?preciosSellados[k]:pr.precio)*editItems[k])+'</div></div>'
        +'<div class="qty"><button type="button" data-d="-1">−</button><span>'+editItems[k]+'</span><button type="button" data-d="1">+</button></div>'
        +'</div>');
      var btns=fila.querySelectorAll('.qty button');
      for(var i=0;i<btns.length;i++){
        (function(b){
          b.addEventListener('click', function(){
            editItems[k]=Math.max(0,(editItems[k]||0)+parseInt(b.getAttribute('data-d'),10));
            pintarLista(); actualizarEdit();
          });
        })(btns[i]);
      }
      cont.appendChild(fila);
    });
  }

  edit.querySelector('[data-e-add]').addEventListener('change', function(e){
    var k=e.target.value; if(!k) return;
    editItems[k]=(editItems[k]||0)+1;
    e.target.value='';
    pintarLista(); actualizarEdit();
  });
  edit.querySelector('[data-e-dom]').addEventListener('input', function(e){
    editDom=parseInt(e.target.value,10)||0;
    actualizarEdit();
  });
  pintarLista(); actualizarEdit();

  det.querySelector('[data-editar-pedido]').addEventListener('click', function(){
    edit.style.display=edit.style.display==='none'?'block':'none';
  });
  edit.querySelector('[data-e-cancelar]').addEventListener('click', function(){
    edit.style.display='none';
  });
  edit.querySelector('[data-e-guardar]').addEventListener('click', function(){
    var li=listaEdit();
    if(li.length===0){ alert('El pedido debe tener al menos un producto.'); return; }
    var t=calc(li);
    p.items=li;
    p.domicilio=(p.tipo==='Domicilio' && t.venta<UMBRAL) ? editDom : 0;
    p.notas=edit.querySelector('[data-e-notas]').value.trim();
    guardarPedidos(pedidos);
    render('pedidos');
  });
  det.appendChild(edit);

  top.addEventListener('click', function(){
    abiertos[p.id]=!abiertos[p.id];
    det.style.display=abiertos[p.id]?'block':'none';
  });

  var botonesEstado=det.querySelectorAll('[data-estado]');
  for(var i=0;i<botonesEstado.length;i++){
    (function(b){
      b.addEventListener('click', function(){
        p.estado=b.getAttribute('data-estado');
        guardarPedidos(pedidos);
        render('pedidos');
      });
    })(botonesEstado[i]);
  }
  var botonesPago=det.querySelectorAll('[data-pago]');
  for(var j=0;j<botonesPago.length;j++){
    (function(b){
      b.addEventListener('click', function(){
        p.pago=b.getAttribute('data-pago');
        guardarPedidos(pedidos);
        render('pedidos');
      });
    })(botonesPago[j]);
  }
  det.querySelector('[data-borrar]').addEventListener('click', function(){
    if(!confirm('¿Eliminar este pedido?')) return;
    pedidos=pedidos.filter(function(x){return x.id!==p.id;});
    guardarPedidos(pedidos);
    render('pedidos');
  });

  card.appendChild(det);
  return card;
}

/* ================= NUEVO ================= */
function renderNuevo(){
  var items={}; var domicilioManual=0;

  var card1=el('<div class="card"><h2>Nuevo pedido</h2>'
    +'<label class="f">Cliente</label><input class="f" id="n-cliente" placeholder="Nombre">'
    +'<label class="f">WhatsApp</label><input class="f" id="n-tel" placeholder="310 653 1071" inputmode="tel">'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    +'<div><label class="f">Tipo</label><select class="f" id="n-tipo">'+TIPOS.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></div>'
    +'<div><label class="f">Canal</label><select class="f" id="n-canal">'+CANALES.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div>'
    +'</div>'
    +'<label class="f">Fecha de entrega</label><input class="f" type="date" id="n-fecha" value="'+hoyISO()+'">'
    +'</div>');
  main.appendChild(card1);

  var spanRefs={};
  function setQty(key, q){
    q=Math.max(0,q);
    if(q===0) delete items[key]; else items[key]=q;
    if(spanRefs[key]) spanRefs[key].textContent=q;
  }

  var cardBundles=el('<div class="card"><h2>Menús para compartir</h2>'
    +'<div class="muted small" style="margin-bottom:8px">Toca un menú para cargar sus cantidades. Puedes ajustarlas después.</div></div>');
  BUNDLES.forEach(function(bn){
    var tb=calc(bn.items);
    var fila=el('<div class="item-row">'
      +'<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(bn.nombre)+'</div>'
      +'<div class="muted small">'+esc(bn.desc)+'</div>'
      +'<div class="money small" style="margin-top:2px">'+fmt(tb.venta)+'</div></div>'
      +'<button class="btn oliva" style="padding:8px 12px;font-size:12px;flex-shrink:0">Cargar</button>'
      +'</div>');
    fila.querySelector('button').addEventListener('click', function(){
      bn.items.forEach(function(it){ setQty(it.key, (items[it.key]||0)+it.qty); });
      actualizarTotal();
    });
    cardBundles.appendChild(fila);
  });
  main.appendChild(cardBundles);

  var card2=el('<div class="card"><h2>Productos</h2></div>');
  PRODUCTOS.forEach(function(p){
    var fila=el('<div class="item-row">'
      +'<div><div style="font-weight:700">'+esc(p.nombre)+'</div>'
      +'<div class="muted small">'+fmt(p.precio)+' · '+esc(p.unidad)+'</div></div>'
      +'<div class="qty"><button type="button" data-d="-1">−</button><span>0</span><button type="button" data-d="1">+</button></div>'
      +'</div>');
    var span=fila.querySelector('.qty span');
    spanRefs[p.key]=span;
    var botones=fila.querySelectorAll('.qty button');
    for(var i=0;i<botones.length;i++){
      (function(b){
        b.addEventListener('click', function(){
          setQty(p.key, (items[p.key]||0)+parseInt(b.getAttribute('data-d'),10));
          actualizarTotal();
        });
      })(botones[i]);
    }
    card2.appendChild(fila);
  });
  main.appendChild(card2);

  var card3=el('<div class="card">'
    +'<div class="row"><span class="muted">Subtotal productos</span><span class="money" id="n-subtotal">0</span></div>'
    +'<div id="n-dom"></div>'
    +'<div class="row" style="margin-top:6px"><span class="muted">Margen estimado</span><span class="money" style="color:var(--oliva-osc)" id="n-margen">0</span></div>'
    +'<label class="f">Notas</label><textarea class="f" rows="2" id="n-notas" placeholder="Dirección, hora, instrucciones…"></textarea>'
    +'<button class="btn primario" id="n-guardar" style="margin-top:12px">Guardar pedido</button>'
    +'<button class="btn fant" id="n-cancelar" style="width:100%;margin-top:6px;color:var(--gris)">Cancelar</button>'
    +'</div>');
  main.appendChild(card3);

  /* el precio de lista de hoy queda sellado en el pedido: si mañana cambia,
     este pedido conserva lo que se cobró */
  function listaItems(){
    return Object.keys(items).map(function(k){
      var pr=prod(k);
      return {key:k, qty:items[k], precio: pr?pr.precio:0};
    });
  }

  function actualizarTotal(){
    var t=calc(listaItems());
    var tipo=card1.querySelector('#n-tipo').value;
    card3.querySelector('#n-subtotal').textContent=fmt(t.venta);
    card3.querySelector('#n-margen').textContent=fmt(t.margen);
    var dom=card3.querySelector('#n-dom');
    if(tipo==='Domicilio'){
      if(t.venta>=UMBRAL){
        dom.innerHTML='<div class="banner" style="margin-top:8px">Domicilio gratis — el pedido supera '+fmt(UMBRAL)+'</div>';
        domicilioManual=0;
      } else {
        dom.innerHTML='<div class="aviso" style="margin-top:8px">Faltan '+fmt(UMBRAL-t.venta)+' para domicilio gratis — sugiere completar con Pan Pita o Tzatziki.</div>'
          +'<label class="f">Valor domicilio</label><input class="f" inputmode="numeric" id="n-domval" placeholder="0" value="'+(domicilioManual||'')+'">';
        dom.querySelector('#n-domval').addEventListener('input', function(e){
          domicilioManual=parseInt(e.target.value,10)||0;
        });
      }
    } else { dom.innerHTML=''; }
  }
  card1.querySelector('#n-tipo').addEventListener('change', actualizarTotal);
  actualizarTotal();

  card3.querySelector('#n-cancelar').addEventListener('click', function(){ render('pedidos'); });
  card3.querySelector('#n-guardar').addEventListener('click', function(){
    var li=listaItems();
    if(li.length===0){ alert('Agrega al menos un producto.'); return; }
    var t=calc(li);
    var tipo=card1.querySelector('#n-tipo').value;
    pedidos.unshift({
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      cliente: card1.querySelector('#n-cliente').value.trim(),
      telefono: card1.querySelector('#n-tel').value.trim(),
      tipo: tipo,
      canal: card1.querySelector('#n-canal').value,
      fecha: card1.querySelector('#n-fecha').value || hoyISO(),
      notas: card3.querySelector('#n-notas').value.trim(),
      domicilio: (tipo==='Domicilio' && t.venta<UMBRAL) ? domicilioManual : 0,
      estado:'Nuevo', pago:'Pendiente', items: li
    });
    guardarPedidos(pedidos);
    filtroPedidos='Activos';
    render('pedidos');
  });
}

/* ================= MENÚ ================= */
function renderMenu(){
  var mes=mesDe(hoyISO());
  var cnt={};
  pedidos.filter(function(p){return mesDe(p.fecha)===mes && p.estado!=='Cancelado';})
    .forEach(function(p){ p.items.forEach(function(it){ cnt[it.key]=(cnt[it.key]||0)+it.qty; }); });

  function chipClase(c){
    if(c==='Estrella') return 'estrella';
    if(c==='Caballo de batalla') return 'caballo';
    if(c==='Rompecabezas') return 'rompe';
    return 'neutro';
  }

  function filaDOM(p, editable){
    var wrap=el('<div class="item-row" style="flex-wrap:wrap;gap:6px"></div>');

    var info=el('<div style="flex:1;min-width:0">'
      +'<div style="font-weight:700">'+esc(p.nombre)+(p.destacar?' <span class="chip rompe">dar énfasis</span>':'')+'</div>'
      +'<div class="muted small">'+fmt(p.precio)+' · '+esc(p.unidad)+(p.nota?' · '+esc(p.nota):'')+'</div>'
      +'<div style="margin-top:3px">'
      +(p.precioBase!=null && p.precio!==p.precioBase
        ? '<span class="chip warn">solo en este equipo · el cliente ve '+fmt(p.precioBase)+'</span> ' : '')
      +(p.clase?'<span class="chip '+chipClase(p.clase)+'">'+esc(p.clase)+'</span> ':'')
      +(p.fc!=null
        ? '<span class="chip '+claseFC(p.fc)+'">FC '+p.fc+'%</span>'
          +(p.fcSrc==='receta'?' <span class="chip neutro">por receta</span>':'')
        : '<span class="chip alerta">sin costear</span>')
      +'</div></div>');
    wrap.appendChild(info);

    var right=el('<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">'
      +'<div class="muted small" style="text-align:right">'+(cnt[p.key]||0)+' und<br/>mes</div>'
      +'<button class="btn fant" style="padding:4px 8px;font-size:11px" data-costear="1">'
      +(p.fcSrc==='receta'?'Ver receta':(editable?'Editar FC':'Costear'))+'</button>'
      +'<button class="btn fant" style="padding:4px 8px;font-size:11px" data-precio="1">Editar precio</button>'
      +'</div>');
    wrap.appendChild(right);

    /* inline: cambiar el precio de venta */
    var formP=el('<div style="display:none;width:100%;padding-top:6px;border-top:1px dashed var(--linea)">'
      +'<label class="f">Precio de venta (COP)</label>'
      +'<div style="display:flex;gap:8px;align-items:center">'
      +'<input class="f" inputmode="numeric" placeholder="ej. 20.000" style="font-size:15px;max-width:140px" data-pv>'
      +'<button class="btn oliva" style="flex:1" data-p-guardar="1">Guardar</button>'
      +'<button class="btn fant" data-p-cancelar="1">Cancelar</button>'
      +'</div>'
      +'<div class="muted small" data-p-preview style="margin-top:4px"></div>'
      +'<div class="muted small" style="margin-top:4px">Los pedidos ya registrados conservan el precio con el que se cobraron.</div>'
      +'<div class="aviso" style="margin-top:6px">Esto cambia el precio <b>solo en este equipo</b>, para simular. Para que el cliente lo vea hay que cambiarlo en <b>precios.js</b> y publicar.</div>'
      +'</div>');
    wrap.appendChild(formP);

    var inputP=formP.querySelector('[data-pv]');
    var previewP=formP.querySelector('[data-p-preview]');
    inputP.value=p.precio;

    function pintarPreviewPrecio(){
      var v=parseCOP(inputP.value);
      if(v>0){
        var fcNuevo=fcDe(p)*p.precio/v;      /* el costo no cambia: el FC se mueve con el precio */
        previewP.textContent='Margen '+fmt(v*(1-fcNuevo/100))+' · food cost quedaría en '+fcNuevo.toFixed(1)+'%'
          +(p.precioBase!=null && v!==p.precioBase ? ' · precio de lista '+fmt(p.precioBase) : '');
      } else { previewP.textContent=''; }
    }
    inputP.addEventListener('input', pintarPreviewPrecio);
    pintarPreviewPrecio();

    right.querySelector('[data-precio]').addEventListener('click', function(){
      formP.style.display=formP.style.display==='none'?'block':'none';
      if(formP.style.display==='block'){ inputP.focus(); inputP.select(); }
    });
    formP.querySelector('[data-p-cancelar]').addEventListener('click', function(){
      formP.style.display='none';
      inputP.value=p.precio; pintarPreviewPrecio();
    });
    formP.querySelector('[data-p-guardar]').addEventListener('click', function(){
      var v=parseCOP(inputP.value);
      if(v<=0){ alert('Escribe un precio válido en pesos, por ejemplo 20.000'); return; }
      cargarPrecios(function(precios){
        precios=precios||{};
        if(p.precioBase!=null && v===p.precioBase) delete precios[p.key];   /* vuelve al de lista */
        else precios[p.key]=v;
        guardarPrecios(precios);
        aplicarPrecios(precios);
        aplicarCosteoRecetas();      /* el FC por receta se recalcula sobre el precio nuevo */
        render('menu');
      });
    });

    /* inline costeo form — hidden by default */
    var form=el('<div style="display:none;width:100%;padding-top:6px;border-top:1px dashed var(--linea)">'
      +'<label class="f">Food cost % real</label>'
      +'<div style="display:flex;gap:8px;align-items:center">'
      +'<input class="f" type="number" min="1" max="100" step="0.1" id="fc-input-'+p.key+'" placeholder="ej. 19.5" style="font-size:15px;max-width:120px">'
      +'<button class="btn oliva" style="flex:1" data-guardar="1">Guardar</button>'
      +'<button class="btn fant" data-cancelar="1">Cancelar</button>'
      +'</div>'
      +'<div class="muted small" id="fc-preview-'+p.key+'" style="margin-top:4px"></div>'
      +'</div>');
    wrap.appendChild(form);

    var input=form.querySelector('input');
    var preview=form.querySelector('#fc-preview-'+p.key);

    if(p.fc!=null) input.value=p.fc;

    input.addEventListener('input', function(){
      var v=parseFloat(input.value);
      if(!isNaN(v) && v>0){
        var margen=p.precio*(1-v/100);
        preview.textContent='Margen estimado: '+fmt(margen)+' COP · '+(v<=num(CFG.metaMax)?'✓ dentro de meta':'⚠ por encima de '+num(CFG.metaMax)+'%');
      } else { preview.textContent=''; }
    });

    right.querySelector('[data-costear]').addEventListener('click', function(){
      if(p.fcSrc==='receta'){    /* lo calcula la receta — se edita en Costeo */
        costeoVista='productos'; costeoAbierto['p'+p.key]=true; render('costeo'); return;
      }
      form.style.display=form.style.display==='none'?'block':'none';
      if(form.style.display==='block') input.focus();
    });
    form.querySelector('[data-cancelar]').addEventListener('click', function(){
      form.style.display='none';
    });
    form.querySelector('[data-guardar]').addEventListener('click', function(){
      var v=parseFloat(input.value);
      if(isNaN(v)||v<=0||v>100){ alert('Ingresa un % válido entre 1 y 100.'); return; }
      p.fc=Math.round(v*10)/10;
      p.fcManual=p.fc;
      cargarCosteos(function(costeos){
        costeos[p.key]=p.fc;
        guardarCosteos(costeos);
        render('menu');
      });
    });

    return wrap;
  }

  /* ---- Matriz de ingeniería de menú ----
     Popularidad por periodo. Base = ventas 2026 por mes; encima se suman
     los pedidos completados (Entregado) por su mes de entrega. */
  var MNOM=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function mesLabel(m){ var a=m.split('-'); return MNOM[parseInt(a[1],10)-1]+' '+a[0]; }

  var appPorMes={};
  pedidos.filter(function(p){return p.estado==='Entregado' && p.fecha;}).forEach(function(p){
    var m=mesDe(p.fecha); if(!appPorMes[m]) appPorMes[m]={};
    p.items.forEach(function(it){ appPorMes[m][it.key]=(appPorMes[m][it.key]||0)+it.qty; });
  });

  /* fijar selección por defecto / validar la actual */
  var mesHoy=mesDe(hoyISO()), anioHoy=mesHoy.slice(0,4);

  var mesesSet={};
  Object.keys(VENTAS_MES).forEach(function(m){ mesesSet[m]=1; });
  Object.keys(appPorMes).forEach(function(m){ mesesSet[m]=1; });
  mesesSet[mesHoy]=1;                                            // el mes actual siempre disponible
  var allMeses=Object.keys(mesesSet).sort().reverse();          // más reciente primero
  var years={}; allMeses.forEach(function(m){ years[m.slice(0,4)]=1; });
  years[anioHoy]=1;                                             // el año actual siempre disponible
  var allYears=Object.keys(years).sort().reverse();
  if(matrizModo==='mes'){
    if(allMeses.indexOf(matrizValor)===-1) matrizValor=(allMeses.indexOf(mesHoy)!==-1?mesHoy:allMeses[0]);
  } else {
    if(allYears.indexOf(matrizValor)===-1) matrizValor=(allYears.indexOf(anioHoy)!==-1?anioHoy:allYears[0]);
  }

  var mesesPeriodo = matrizModo==='mes' ? [matrizValor]
                    : allMeses.filter(function(m){return m.slice(0,4)===matrizValor;});
  function acumular(fuente){
    var out={};
    mesesPeriodo.forEach(function(m){
      var src=fuente[m]||{};
      for(var k in src) out[k]=(out[k]||0)+src[k];
    });
    return out;
  }
  var baseMap=acumular(VENTAS_MES), appMap=acumular(appPorMes);

  var datos=PRODUCTOS.map(function(p){
    var base=baseMap[p.key]||0, nuevos=appMap[p.key]||0;
    return { p:p, key:p.key, margen:p.precio*(1-fcDe(p)/100), base:base, nuevos:nuevos, units:base+nuevos, estimado:(p.fc==null) };
  });
  var totalUnits=datos.reduce(function(s,d){return s+d.units;},0);
  var totalNuevos=datos.reduce(function(s,d){return s+d.nuevos;},0);
  var avgMargen=datos.reduce(function(s,d){return s+d.margen;},0)/datos.length;
  var avgUnits=totalUnits/datos.length;

  function quad(d){
    var altoM=d.margen>=avgMargen, altaP=d.units>=avgUnits;
    if(altoM&&altaP) return 'estrella';
    if(!altoM&&altaP) return 'caballo';
    if(altoM&&!altaP) return 'rompe';
    return 'perro';
  }
  var grupos={estrella:[],caballo:[],rompe:[],perro:[]};
  datos.forEach(function(d){ grupos[quad(d)].push(d); });

  function celda(titulo, sub, key, chipCls){
    var items=grupos[key].sort(function(a,b){return b.units-a.units;});
    var lista=items.length
      ? items.map(function(d){
          return '<div class="row small" style="padding:2px 0"><span>'+esc(d.p.nombre)
            +(d.estimado?' <span class="muted" style="font-size:10px">~est</span>':'')
            +'</span><span class="muted">'+d.units
            +(d.nuevos>0?' <span style="color:var(--oliva-osc);font-weight:700">+'+d.nuevos+'</span>':'')
            +'</span></div>';
        }).join('')
      : '<div class="muted small" style="padding:2px 0">—</div>';
    return '<div style="border:1px solid var(--linea);border-radius:9px;padding:8px;background:var(--carta)">'
      +'<div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">'
      +'<span class="chip '+chipCls+'">'+esc(titulo)+'</span></div>'
      +'<div class="muted" style="font-size:10px;margin-bottom:4px">'+esc(sub)+'</div>'
      +lista+'</div>';
  }

  var opciones = (matrizModo==='mes'
      ? allMeses.map(function(m){return '<option value="'+m+'"'+(m===matrizValor?' selected':'')+'>'+mesLabel(m)+'</option>';})
      : allYears.map(function(y){return '<option value="'+y+'"'+(y===matrizValor?' selected':'')+'>'+y+'</option>';})
    ).join('');

  var matriz=el('<div class="card"><h2>Ingeniería de menú</h2>'
    +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">'
    +'<div class="pills" style="margin:0">'

/* ============ EXPORTAR DATOS A CSV ============
   Tres reportes para abrir en Excel: historial de pedidos, ingresos reales
   por producto y clientes con su frecuencia. Todo sale de los pedidos
   guardados; los ingresos usan el precio sellado en cada pedido. */
function csvQ(s){ s=String(s==null?'':s); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function csvFila(a){ return a.map(csvQ).join(';'); }
function nombreProd(k){ var p=prod(k); return p? p.nombre : k; }
function pedidosOrdenados(lista){
  return (lista||pedidos).slice().sort(function(a,b){
    var fa=a.fecha||'', fb=b.fecha||'';
    return fa<fb?-1:fa>fb?1:0;
  });
}

/* ---- periodo del reporte: todo / un año / un mes ----
   'anio' incluye lo corrido del año hasta hoy, porque no hay fechas futuras
   más allá de los pedidos ya agendados. */
var expModo='todo';     /* 'todo' | 'anio' | 'mes' */
var expValor=null;      /* '2026' o '2026-07' */
var MESES_ES=['enero','febrero','marzo','abril','mayo','junio',
              'julio','agosto','septiembre','octubre','noviembre','diciembre'];
function etiquetaMes(m){
  var a=(m||'').split('-');
  if(a.length<2) return m||'';
  return MESES_ES[parseInt(a[1],10)-1]+' '+a[0];
}
function periodosDisponibles(){
  var anios={}, meses={};
  pedidos.forEach(function(p){
    if(!p.fecha) return;
    anios[p.fecha.slice(0,4)]=true;
    meses[mesDe(p.fecha)]=true;
  });
  function desc(o){ return Object.keys(o).sort().reverse(); }
  return {anios:desc(anios), meses:desc(meses)};
}
function pedidosDelPeriodo(){
  if(expModo==='todo' || !expValor) return pedidos;
  if(expModo==='anio') return pedidos.filter(function(p){ return (p.fecha||'').slice(0,4)===expValor; });
  return pedidos.filter(function(p){ return mesDe(p.fecha)===expValor; });
}
function etiquetaPeriodo(){
  if(expModo==='todo' || !expValor) return 'todo el historial';
  if(expModo==='anio') return 'año '+expValor;
  return etiquetaMes(expValor);
}
function sufijoArchivo(){
  if(expModo==='todo' || !expValor) return 'completo_'+hoyISO();
  return expValor;
}
function diasDesde(f){
  if(!f) return '';
  return Math.floor((new Date(hoyISO())-new Date(f))/86400000);
}

/* 1) Historial completo de pedidos — una fila por línea de pedido.
   El domicilio y el total van solo en la primera línea de cada pedido, para
   que sumar esas columnas en Excel no cuente el mismo pedido dos veces. */
function csvPedidos(lista){
  var L=[];
  L.push(csvFila(['pedido_id','fecha','mes','cliente','telefono','tipo','canal','estado','pago',
    'producto','cantidad','precio_unitario','subtotal','food_cost_%','costo_linea','margen_linea',
    'domicilio','total_pedido','notas']));
  pedidosOrdenados(lista).forEach(function(p){
    var t=calc(p.items);
    var total=t.venta+(p.domicilio||0);
    (p.items||[]).forEach(function(it, idx){
      var pr=prod(it.key);
      var precio=precioItem(it);
      var sub=precio*it.qty;
      var fc=pr?fcDe(pr):0;
      var costo=sub*fc/100;
      L.push(csvFila([
        p.id||'', p.fecha||'', mesDe(p.fecha), p.cliente||'', p.telefono||'',
        p.tipo||'', p.canal||'', p.estado||'', p.pago||'',
        nombreProd(it.key), it.qty, Math.round(precio), Math.round(sub),
        fc.toFixed(1), Math.round(costo), Math.round(sub-costo),
        idx===0 ? Math.round(p.domicilio||0) : '',
        idx===0 ? Math.round(total) : '',
        idx===0 ? (p.notas||'') : ''
      ]));
    });
  });
  return L.join('\n');
}

/* 2) Ingresos reales por producto — solo pedidos Entregado.
   Lo que está en proceso va aparte para no inflar la cifra real. */
function csvIngresosProducto(lista){
  var real={}, proceso={}, porMes={}, domReal=0;
  var mesesSet={};
  (lista||pedidos).forEach(function(p){
    if(p.estado==='Cancelado') return;
    var entregado=(p.estado==='Entregado');
    if(entregado) domReal+=(p.domicilio||0);
    var m=mesDe(p.fecha);
    if(entregado && m) mesesSet[m]=true;
    (p.items||[]).forEach(function(it){
      var precio=precioItem(it);
      var sub=precio*it.qty;
      var destino=entregado?real:proceso;
      if(!destino[it.key]) destino[it.key]={u:0,ing:0};
      destino[it.key].u+=it.qty; destino[it.key].ing+=sub;
      if(entregado && m){
        var mk=it.key+'|'+m;
        if(!porMes[mk]) porMes[mk]={key:it.key,mes:m,u:0,ing:0};
        porMes[mk].u+=it.qty; porMes[mk].ing+=sub;
      }
    });
  });
  var totalReal=0;
  Object.keys(real).forEach(function(k){ totalReal+=real[k].ing; });

  var L=[];
  L.push('INGRESOS REALES POR PRODUCTO (pedidos entregados) — '+etiquetaPeriodo());
  L.push(csvFila(['producto','unidades','ingresos','precio_promedio','food_cost_%',
    'costo_estimado','margen_estimado','%_de_ingresos']));
  Object.keys(real).sort(function(a,b){ return real[b].ing-real[a].ing; }).forEach(function(k){
    var r=real[k], pr=prod(k), fc=pr?fcDe(pr):0;
    var costo=r.ing*fc/100;
    L.push(csvFila([nombreProd(k), r.u, Math.round(r.ing), Math.round(r.ing/r.u),
      fc.toFixed(1), Math.round(costo), Math.round(r.ing-costo),
      totalReal? (r.ing/totalReal*100).toFixed(1) : '0.0']));
  });
  L.push(csvFila(['TOTAL PRODUCTOS','', Math.round(totalReal),'','','','','100.0']));
  L.push(csvFila(['Domicilios cobrados','', Math.round(domReal),'','','','','']));
  L.push(csvFila(['TOTAL FACTURADO','', Math.round(totalReal+domReal),'','','','','']));

  L.push(''); L.push('EN PROCESO (aún no entregados)');
  L.push(csvFila(['producto','unidades','ingresos_pendientes']));
  Object.keys(proceso).sort(function(a,b){ return proceso[b].ing-proceso[a].ing; }).forEach(function(k){
    L.push(csvFila([nombreProd(k), proceso[k].u, Math.round(proceso[k].ing)]));
  });

  L.push(''); L.push('POR MES (entregados)');
  L.push(csvFila(['producto','mes','unidades','ingresos']));
  Object.keys(porMes).sort(function(a,b){
    var x=porMes[a], y=porMes[b];
    if(x.mes!==y.mes) return x.mes<y.mes?-1:1;
    return y.ing-x.ing;
  }).forEach(function(mk){
    var r=porMes[mk];
    L.push(csvFila([nombreProd(r.key), r.mes, r.u, Math.round(r.ing)]));
  });
  return L.join('\n');
}

/* 3) Clientes y frecuencia — mismo criterio que la pestaña Clientes:
   frecuente = 3+ pedidos, reactivar = más de 30 días sin pedir. */
function csvClientes(lista){
  /* Los totales son del periodo elegido, pero "última compra" y "días sin
     pedir" se miden contra todo el historial: un cliente no se vuelve
     inactivo solo porque el reporte mire un mes. */
  var ultimaGlobal={};
  pedidos.filter(function(p){return p.estado!=='Cancelado';}).forEach(function(p){
    var k=(p.telefono||p.cliente||'').trim(); if(!k || !p.fecha) return;
    if(!ultimaGlobal[k] || p.fecha>ultimaGlobal[k]) ultimaGlobal[k]=p.fecha;
  });
  var mapa={};
  (lista||pedidos).filter(function(p){return p.estado!=='Cancelado';}).forEach(function(p){
    var k=(p.telefono||p.cliente||'').trim(); if(!k) return;
    if(!mapa[k]) mapa[k]={clave:k, nombre:p.cliente||k, telefono:p.telefono||'', pedidos:0, total:0,
                          primera:p.fecha, ultima:p.fecha, prods:{}, canales:{}};
    var m=mapa[k];
    m.pedidos++; m.total+=calc(p.items).venta+(p.domicilio||0);
    if(p.fecha && (!m.primera || p.fecha<m.primera)) m.primera=p.fecha;
    if(p.fecha && (!m.ultima  || p.fecha>m.ultima))  m.ultima=p.fecha;
    if(p.cliente) m.nombre=p.cliente;
    if(p.canal) m.canales[p.canal]=(m.canales[p.canal]||0)+1;
    (p.items||[]).forEach(function(it){ m.prods[it.key]=(m.prods[it.key]||0)+it.qty; });
  });
  function top(obj){
    var mejor=null, n=0;
    Object.keys(obj).forEach(function(k){ if(obj[k]>n){ n=obj[k]; mejor=k; } });
    return {k:mejor, n:n};
  }
  var L=[];
  L.push(csvFila(['cliente','telefono','pedidos','total_comprado','ticket_promedio',
    'primera_compra','ultima_compra','dias_sin_pedir','frecuente','reactivar',
    'canal_habitual','producto_favorito','unidades_favorito']));
  Object.keys(mapa).map(function(k){return mapa[k];})
    .sort(function(a,b){ return b.total-a.total; })
    .forEach(function(c){
      var ult=ultimaGlobal[c.clave]||c.ultima;
      var d=diasDesde(ult);
      var fav=top(c.prods), can=top(c.canales);
      L.push(csvFila([c.nombre, c.telefono, c.pedidos, Math.round(c.total),
        Math.round(c.total/c.pedidos), c.primera||'', ult||'', d,
        c.pedidos>=3?'si':'no', (d!=='' && d>30)?'si':'no',
        can.k||'', fav.k?nombreProd(fav.k):'', fav.n||0]));
    });
  return L.join('\n');
}

/* Descarga sin depender de que el navegador acepte cambiar href en el click. */
function descargarCSV(nombre, texto){
  try{
    var blob=new Blob(['﻿'+texto], {type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=nombre;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      if(a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
    return true;
  }catch(e){ return false; }
}

function exportarDatosCard(){
  var reportes=[
    {id:'pedidos',   titulo:'Historial de pedidos',
     desc:'Una fila por producto de cada pedido, con precio cobrado y margen.',
     archivo:'elgriego_pedidos_',   gen:csvPedidos},
    {id:'ingresos',  titulo:'Ingresos reales por producto',
     desc:'Solo pedidos entregados, con desglose por mes. Lo pendiente va aparte.',
     archivo:'elgriego_ingresos_',  gen:csvIngresosProducto},
    {id:'clientes',  titulo:'Clientes y frecuencia',
     desc:'Pedidos, ticket promedio, días sin pedir y producto favorito.',
     archivo:'elgriego_clientes_',  gen:csvClientes}
  ];

  var per=periodosDisponibles();
  /* si el periodo guardado ya no existe (se borraron pedidos), volver a Todo */
  if(expModo==='anio' && per.anios.indexOf(expValor)<0) expValor=per.anios[0]||null;
  if(expModo==='mes'  && per.meses.indexOf(expValor)<0) expValor=per.meses[0]||null;
  if(expModo!=='todo' && !expValor) expModo='todo';

  var card=el('<div class="card"><h2>Exportar datos</h2>'
    +'<div class="muted small" style="margin-bottom:8px">Archivos CSV para abrir en Excel. Si el iPhone no deja descargar, usa <b>Copiar</b> y pégalo en una nota o correo.</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">'
    +'<button class="btn fant" style="padding:6px 10px;font-size:12px" data-modo="todo">Todo</button>'
    +'<button class="btn fant" style="padding:6px 10px;font-size:12px" data-modo="anio">Por año</button>'
    +'<button class="btn fant" style="padding:6px 10px;font-size:12px" data-modo="mes">Por mes</button>'
    +'<select class="f" data-periodo style="margin:0;flex:1;min-width:120px"></select>'
    +'</div>'
    +'<div class="muted small" data-ex-per style="margin-bottom:8px"></div>'
    +'<div class="muted small" id="ex-msg" style="margin-top:8px"></div></div>');
  var msg=card.querySelector('#ex-msg');
  var sel=card.querySelector('[data-periodo]');
  var lblPer=card.querySelector('[data-ex-per]');

  function pintarPeriodo(){
    var botones=card.querySelectorAll('[data-modo]');
    for(var i=0;i<botones.length;i++){
      var activo=botones[i].getAttribute('data-modo')===expModo;
      botones[i].className='btn '+(activo?'oliva':'fant');
      botones[i].style.padding='6px 10px'; botones[i].style.fontSize='12px';
    }
    sel.style.display = (expModo==='todo') ? 'none' : '';
    if(expModo!=='todo'){
      var vals = expModo==='anio' ? per.anios : per.meses;
      sel.innerHTML = vals.map(function(v){
        return '<option value="'+v+'"'+(v===expValor?' selected':'')+'>'
          +esc(expModo==='anio'? v : etiquetaMes(v))+'</option>';
      }).join('');
    }
    var n=pedidosDelPeriodo().length;
    lblPer.textContent='Exportando '+etiquetaPeriodo()+' · '+n+' pedido'+(n!==1?'s':'')+'.';
  }
  var btns=card.querySelectorAll('[data-modo]');
  for(var bi=0;bi<btns.length;bi++){
    (function(b){
      b.addEventListener('click', function(){
        expModo=b.getAttribute('data-modo');
        if(expModo==='anio') expValor=per.anios[0]||null;
        else if(expModo==='mes') expValor=per.meses[0]||null;
        else expValor=null;
        pintarPeriodo(); msg.textContent='';
      });
    })(btns[bi]);
  }
  sel.addEventListener('change', function(){ expValor=sel.value; pintarPeriodo(); msg.textContent=''; });
  pintarPeriodo();

  reportes.forEach(function(r){
    var fila=el('<div class="item-row" style="flex-wrap:wrap;gap:6px">'
      +'<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(r.titulo)+'</div>'
      +'<div class="muted small">'+esc(r.desc)+'</div></div>'
      +'<div style="display:flex;gap:6px;flex-shrink:0">'
      +'<button class="btn oliva" style="padding:6px 10px;font-size:12px" data-dl>Descargar</button>'
      +'<button class="btn fant" style="padding:6px 10px;font-size:12px" data-cp>Copiar</button>'
      +'</div></div>');

    function lista(){ return pedidosDelPeriodo(); }
    function vacio(){
      var l=lista();
      if(!l.length){
        msg.textContent = pedidos.length
          ? 'No hay pedidos en '+etiquetaPeriodo()+'.'
          : 'Todavía no hay pedidos que exportar.';
        return true;
      }
      return false;
    }

    fila.querySelector('[data-dl]').addEventListener('click', function(){
      if(vacio()) return;
      var texto=r.gen(lista());
      var ok=descargarCSV(r.archivo+sufijoArchivo()+'.csv', texto);
      msg.textContent = ok
        ? 'Descargando '+r.titulo.toLowerCase()+' — '+etiquetaPeriodo()+'…'
        : 'Este navegador no permite descargar — usa Copiar.';
    });
    fila.querySelector('[data-cp]').addEventListener('click', function(){
      if(vacio()) return;
      var texto=r.gen(lista());
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(texto).then(
          function(){ msg.textContent=r.titulo+' ('+etiquetaPeriodo()+'): copiado al portapapeles.'; },
          function(){ msg.textContent='No se pudo copiar — usa Descargar.'; });
      } else { msg.textContent='Este navegador no permite copiar — usa Descargar.'; }
    });
    card.insertBefore(fila, msg);
  });
  return card;
}

/* ============ COPIA DE SEGURIDAD ============ */
function backupCard(){
  var card=el('<div class="card"><h2>Copia de seguridad</h2>'
    +'<div class="muted small" style="margin-bottom:6px">“Crear copia” genera un texto con tus pedidos <b>y tus costeos</b>: cópialo y guárdalo donde quieras (Notas, WhatsApp contigo misma). Para pasar los datos a otro dispositivo o recuperarlos, pega ese texto aquí y toca “Restaurar”.</div>'
    +'<textarea class="f" rows="3" id="bk-txt" placeholder="Aquí aparece tu copia / pega aquí para restaurar"></textarea>'
    +'<div style="display:flex;gap:8px;margin-top:8px">'
    +'<button class="btn oliva" id="bk-exp" style="flex:1">Crear copia</button>'
    +'<button class="btn primario" id="bk-imp" style="flex:1;width:auto">Restaurar</button>'
    +'</div>'
    +'<div class="muted small" id="bk-msg" style="margin-top:6px"></div>'
    +'</div>');
  var ta=card.querySelector('#bk-txt');
  var msg=card.querySelector('#bk-msg');
  card.querySelector('#bk-exp').addEventListener('click', function(){
    cargarCosteos(function(costeos){
     cargarPrecios(function(precios){
      var sobre={ v:4, pedidos:pedidos, costeos:costeos, recetas:costeoModelo(), precios:precios };
      ta.value=JSON.stringify(sobre);
      ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      var nCost=Object.keys(costeos||{}).length;
      var nPre=Object.keys(precios||{}).length;
      var resumen=pedidos.length+' pedidos · '+nCost+' costeos · costeo por recetas'
        +(nPre?' · '+nPre+' precios':'');
      var copiado=false;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){ msg.textContent='Copia creada y copiada al portapapeles ('+resumen+').'; });
        copiado=true;
      }
      if(!copiado){
        try{ document.execCommand('copy'); }catch(e){}
        msg.textContent='Copia creada ('+resumen+'). Mantén presionado el texto para copiarlo.';
      }
     });
    });
  });
  card.querySelector('#bk-imp').addEventListener('click', function(){
    try{
      var d=JSON.parse(ta.value);
      var nuevosPedidos, nuevosCosteos=null;
      if(Array.isArray(d)){
        /* copia antigua: solo pedidos */
        nuevosPedidos=d;
      } else if(d && Array.isArray(d.pedidos)){
        /* copia nueva: pedidos + costeos */
        nuevosPedidos=d.pedidos;
        nuevosCosteos=(d.costeos && typeof d.costeos==='object') ? d.costeos : {};
      } else {
        throw new Error('formato');
      }
      pedidos=nuevosPedidos;
      guardarPedidos(pedidos);
      var resumen=pedidos.length+' pedidos';
      if(nuevosCosteos){
        guardarCosteos(nuevosCosteos);
        aplicarCosteos(nuevosCosteos);
        resumen+=' · '+Object.keys(nuevosCosteos).length+' costeos';
      }
      if(d && d.recetas){
        costeoCargarModelo(d.recetas);
        guardarRecetas();
        resumen+=' · recetas';
      }
      /* precios editados (copias v4 en adelante) */
      var nuevosPrecios=(d && d.precios && typeof d.precios==='object') ? d.precios : {};
      guardarPrecios(nuevosPrecios);
      aplicarPrecios(nuevosPrecios);
      var nPre=Object.keys(nuevosPrecios).length;
      if(nPre) resumen+=' · '+nPre+' precios';
      /* pedidos de copias viejas: se sellan con el precio de lista */
      sellarPreciosPedidos();
      aplicarCosteoRecetas();
      msg.textContent='Restaurado: '+resumen+'.';
      render('hoy');
    }catch(e){
      msg.textContent='Ese texto no es una copia válida. Pega exactamente lo que generó “Crear copia”.';
    }
  });
  return card;
}

/* ================= CLIENTES ================= */
function renderClientes(){
  var mapa={};
  pedidos.filter(function(p){return p.estado!=='Cancelado';}).forEach(function(p){
    var k=(p.telefono||p.cliente||'').trim(); if(!k) return;
    if(!mapa[k]) mapa[k]={nombre:p.cliente||k, telefono:p.telefono, pedidos:0, total:0, ultima:p.fecha};
    var m=mapa[k];
    m.pedidos++; m.total+=calc(p.items).venta+(p.domicilio||0);
    if(p.fecha>m.ultima) m.ultima=p.fecha;
    if(p.cliente) m.nombre=p.cliente;
  });
  var lista=Object.keys(mapa).map(function(k){return mapa[k];}).sort(function(a,b){return b.total-a.total;});

  var card=el('<div class="card"><h2>Clientes ('+lista.length+')</h2>'
    +'<div class="muted small" style="margin-bottom:8px">Retención por WhatsApp es la prioridad #2: las clientas marcadas “reactivar” llevan más de 30 días sin pedir.</div></div>');

  if(lista.length===0){
    card.appendChild(el('<div class="muted">Los clientes aparecen aquí automáticamente al registrar pedidos.</div>'));
  } else {
    lista.forEach(function(c){
      var clave=(c.telefono||c.nombre||'').trim();
      var d=Math.floor((new Date(hoyISO())-new Date(c.ultima))/86400000);
      var nombrePila=(c.nombre||'').split(' ')[0];
      var wa=waLink(c.telefono, '¡Hola '+nombrePila+'! 💙 Esta semana en El Griego tenemos los platos que te encantan. ¿Te dejamos tu pedido listo?');

      var wrap=el('<div style="border-bottom:1px dashed var(--linea);padding:8px 0"></div>');

      var top=el('<div style="cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:8px">'
        +'<div style="flex:1;min-width:0">'

        +'<div class="muted small">'+c.pedidos+' pedido'+(c.pedidos>1?'s':'')+' · '+fmt(c.total)+' · último hace '+d+' día'+(d!==1?'s':'')+'</div>'
        +'<div style="margin-top:3px">'
        +(c.pedidos>=3?'<span class="chip estrella">frecuente</span> ':'')
        +(d>30?'<span class="chip alerta">reactivar</span>':'')
        +'</div></div>'
        +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">'
        +(wa?'<a class="btn wa" href="'+wa+'" target="_blank" rel="noreferrer">Escribir</a>':'')
        +'<button class="btn fant" data-editar="1" style="color:var(--azul)">Editar</button>'
        +'<button class="btn fant" data-eliminar="1">Eliminar</button>'
        +'</div></div>');

      /* order history panel */
      var pedidosCliente=pedidos.filter(function(p){
        return ((p.telefono||p.cliente||'').trim())===clave && p.estado!=='Cancelado';
      }).slice().sort(function(a,b){ return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0; });

      var histHtml='<div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--linea)">';
      pedidosCliente.forEach(function(p){
        var t=calc(p.items);
        histHtml+='<div style="margin-bottom:10px">'
          +'<div class="row small"><span style="font-weight:700">'+esc(p.fecha)+'</span>'

          +'<div class="muted small" style="margin-bottom:3px">'+esc(p.tipo)+' · '+esc(p.canal)+'</div>';
        p.items.forEach(function(it){
          var pr=prod(it.key);
          if(pr) histHtml+='<div class="muted small">'+it.qty+' × '+esc(pr.nombre)+'</div>';
        });
        histHtml+='<div style="margin-top:3px">'
          +'<span class="chip '+(p.estado==='Entregado'?'ok':'neutro')+'">'+esc(p.estado)+'</span> '
          +'<span class="chip '+(p.pago==='Pagado'?'ok':'warn')+'">'+esc(p.pago||'Pendiente')+'</span>'
          +'</div></div>';
      });

        var nuevoNombre=edit.querySelector('[data-e-nombre]').value.trim();

        if(!nuevoNombre && !nuevoTel){ alert('Ingresa al menos un nombre o un WhatsApp.'); return; }
        pedidos.forEach(function(p){
          if(((p.telefono||p.cliente||'').trim())===clave){
            p.cliente=nuevoNombre; p.telefono=nuevoTel;
          }
        });
        guardarPedidos(pedidos);
        render('clientes');
      });

        if(!confirm('¿Eliminar a '+c.nombre+' y todos sus pedidos?')) return;
        pedidos=pedidos.filter(function(p){
          return ((p.telefono||p.cliente||'').trim())!==clave;
        });
        guardarPedidos(pedidos);
        render('clientes');
      });

      wrap.appendChild(top);
      wrap.appendChild(edit);
      wrap.appendChild(det);
      card.appendChild(wrap);
    });
  }
  main.appendChild(card);
}

var CFG_BASE={merma:3, metaMin:28, metaMax:30, empaque:0, gas:0, labor:0};

var INGREDIENTES={}, RECETAS={}, ENSAMBLES={}, CFG={};

var MODELO_V=4;
function costeoModelo(){
  return {v:MODELO_V, ingredientes:INGREDIENTES, recetas:RECETAS, ensambles:ENSAMBLES, cfg:CFG};
}
/* Sube modelos guardados con versiones viejas al esquema actual.
   Marca costeoMigrado para que el arranque vuelva a guardar: si no, la versión
   guardada nunca avanza y las migraciones se repiten en cada carga, pisando
   cambios que el usuario haya hecho a propósito después. */
var costeoMigrado=false;
function costeoMigrar(d){
  if(!d) return d;
  var v=num(d.v)||1;
  if(v<MODELO_V) costeoMigrado=true;
  if(v<2){
    /* el corte pasó a llamarse brazo de cerdo */
    if(d.ingredientes && d.ingredientes.pernil) d.ingredientes.pernil.n='Brazo de cerdo';
    /* las porciones de carne se medían sobre la mezcla marinada, no sobre la carne */
    ['gyros_cerdo','gyros_pollo','gyros_bondiola','kebab'].forEach(function(k){
      var e=d.ensambles && d.ensambles[k];
      if(e && e.comp && e.comp[0] && e.comp[0].length<3) e.comp[0][2]='base';
    });
    d.v=2;
  }
  if(v<3){
    /* el kebab se pesa ya armado (con cebolla, pan rallado y agua), no la carne sola */
    var ek=d.ensambles && d.ensambles.kebab;
    if(ek){
      if(ek.comp && ek.comp[0]) ek.comp[0][2]='servido';
      delete ek.alerta;
    }
    d.v=3;
  }
  if(v<4){
    /* faltaba el tomate y la cebolla que van crudos dentro del pan: estaban en
       el producto pero no en el costeo. 30 g + 15 g por porción. */
    if(d.recetas && !d.recetas.r_aderezo_gyros){
      d.recetas.r_aderezo_gyros={k:'r_aderezo_gyros',n:'Tomate y cebolla (gyros)',base:'tomate',baseG:30,factor:1,nota:'Rodajas crudas que van dentro del pan: 30 g de tomate + 15 g de cebolla roja por porción.',lineas:[['tomate',1],['cebolla_roja',0.5]]};
    }
    ['gyros_cerdo','gyros_pollo','gyros_bondiola','kebab'].forEach(function(k){
      var e=d.ensambles && d.ensambles[k];
      if(!e || !e.comp) return;
      /* respetar al usuario si ya lo agregó a mano */
      var ya=e.comp.some(function(c){ return c[0]==='r_aderezo_gyros'; });
      if(!ya) e.comp.push(['r_aderezo_gyros',45]);
    });
    d.v=4;
  }
  return d;
}
function costeoCargarModelo(d){
  d=costeoMigrar(d);
  INGREDIENTES = (d && d.ingredientes) ? d.ingredientes : ingredientesBase();
  RECETAS      = (d && d.recetas)      ? d.recetas      : recetasBase();
  ENSAMBLES    = (d && d.ensambles)    ? d.ensambles    : ensamblesBase();
  CFG          = {};
  for(var k in CFG_BASE) CFG[k]=CFG_BASE[k];
  if(d && d.cfg) for(var k2 in d.cfg) CFG[k2]=d.cfg[k2];
  delete CFG.meta;   /* reemplazado por metaMin/metaMax */
}

var memoriaRecetas=null;
function cargarRecetas(cb){
  if (window.storage && typeof window.storage.get==='function'){
    window.storage.get('elgriego_recetas').then(function(r){
      var d=null; try{ if(r && r.value) d=JSON.parse(r.value); }catch(e){}
      cb(d);
    }).catch(function(){ cb(null); });
    return;
  }
  if (localStorageDisponible()){
    try{ var v=localStorage.getItem('elgriego_recetas'); cb(v?JSON.parse(v):null); return; }
    catch(e){ cb(null); return; }
  }
  cb(memoriaRecetas);
}
function guardarRecetas(){

  memoriaRecetas=d;
  var s=JSON.stringify(d);
  if (modoGuardado==='claude' && window.storage && typeof window.storage.set==='function'){
    window.storage.set('elgriego_recetas', s).catch(function(){});

  }

/* ---- motor de cálculo ---- */
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }

/* COP por gramo a partir de la unidad de compra real */
function copG(ing){
  if(!ing || !ing.compra) return 0;
  var c=num(ing.compra.c), p=num(ing.compra.p);
  if(!c) return 0;
  if(ing.compra.u==='u'){ var pu=num(ing.pesoU); return pu ? p/(c*pu) : 0; }
  return p/c;                      /* g y ml se tratan igual */
}
function compraTxt(ing){
  if(!ing || !ing.compra) return '';
  var u=ing.compra.u, un=(u==='u'?'und':u);
  return fmt(num(ing.compra.c))+' '+un+' = '+fmt(num(ing.compra.p))+' COP';
}

function recetaCalc(rk){
  var r=RECETAS[rk]; if(!r) return null;
  var costo=0, crudo=0, lineas=[];
  (r.lineas||[]).forEach(function(l){
    var ing=INGREDIENTES[l[0]]; if(!ing) return;
    var g=num(r.baseG)*num(l[1]), cg=copG(ing);
    costo+=g*cg; crudo+=g;
    lineas.push({ing:ing, ratio:num(l[1]), g:g, cg:cg, costo:g*cg});
  });
  lineas.sort(function(a,b){ return b.costo-a.costo; });
  var f=num(r.factor)||1;
  var fin=crudo*f;
  return {r:r, lineas:lineas, costo:costo, crudo:crudo, factor:f, final:fin,
          copGFinal: fin ? costo/fin : 0};
}

/* Qué fracción del lote consume un componente.
   modo 'base'    -> la porción se mide en gramos del ingrediente base (150 g de carne)
   modo 'servido' -> la porción se mide en gramos de la receta terminada (90 g de pan) */
function fracLote(rc, comp, qty){
  var cant=num(comp[1])*(qty==null?1:qty);
  if((comp[2]||'servido')==='base'){
    var b=num(rc.r.baseG); return b ? cant/b : 0;
  }
  return rc.final ? cant/rc.final : 0;
}
function productoCalc(pk){
  var p=prod(pk), e=ENSAMBLES[pk];
  if(!p || !e) return null;
  var ing=0, det=[], fijo=(e.costoFijo!=null);
  if(fijo){
    ing=num(e.costoFijo);
    det.push({nombre:'Costo de receta (cargado a mano)', g:null, costo:ing});
  } else {
    (e.comp||[]).forEach(function(c){
      var rc=recetaCalc(c[0]); if(!rc) return;
      var costo=rc.costo*fracLote(rc,c);
      ing+=costo;
      det.push({nombre:rc.r.n, g:num(c[1]), modo:(c[2]||'servido'),
                base:(INGREDIENTES[rc.r.base]||{}).n, costo:costo, rk:c[0]});
    });
  }
  var merma = fijo ? 0 : ing*(num(CFG.merma)/100);
  var ingT  = ing+merma;
  var emp=(e.empaque!=null?num(e.empaque):num(CFG.empaque));
  var gas=(e.gas!=null?num(e.gas):num(CFG.gas));
  var lab=(e.labor!=null?num(e.labor):num(CFG.labor));
  var total=ingT+emp+gas+lab;
  return {p:p, e:e, det:det, fijo:fijo, vacio:(!fijo && !det.length),
          ing:ing, merma:merma, ingT:ingT,
          empaque:emp, gas:gas, labor:lab, total:total,
          fc: p.precio ? total/p.precio*100 : 0,
          margen: p.precio-total,
          margenPct: p.precio ? (p.precio-total)/p.precio*100 : 0};
}

/* Vuelca el FC calculado sobre PRODUCTOS para que la matriz de menú lo use.
   Guarda el FC manual la primera vez, para poder volver a él si al producto
   se le quita la receta: si no, quedaba pegado el último valor calculado. */
function aplicarCosteoRecetas(){
  PRODUCTOS.forEach(function(p){
    if(p.fcManual===undefined) p.fcManual=(p.fc==null?null:p.fc);
    var c=productoCalc(p.key);
    if(c && !c.vacio){ p.fc=Math.round(c.fc*10)/10; p.fcSrc='receta'; }
    else { p.fc=p.fcManual; p.fcSrc=null; }
  });
}

/* gramos crudos de cada ingrediente para una cantidad de producto */
function ingredientesDe(pk, qty){
  var e=ENSAMBLES[pk], out={};
  if(!e || e.costoFijo!=null) return out;
  (e.comp||[]).forEach(function(c){
    var rc=recetaCalc(c[0]); if(!rc || !rc.final) return;
    var frac=fracLote(rc,c,qty);
    rc.lineas.forEach(function(l){
      out[l.ing.k]=(out[l.ing.k]||0)+l.g*frac;
    });
  });
  return out;
}

/* ---- crear / borrar: claves e integridad referencial ---- */
function slugKey(nombre, existentes, pre){
  var b=(nombre||'').toLowerCase()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i')
    .replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').replace(/ñ/g,'n')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  if(!b) b='item';
  b=(pre||'')+b;
  var k=b, i=2;
  while(existentes[k]){ k=b+'_'+i; i++; }
  return k;
}
/* Nombres de las recetas que usan un ingrediente (para no borrarlo a ciegas). */
function recetasQueUsan(ingKey){
  var out=[];
  Object.keys(RECETAS).forEach(function(rk){
    var r=RECETAS[rk];
    var enLineas=(r.lineas||[]).some(function(l){ return l[0]===ingKey; });
    if(r.base===ingKey || enLineas) out.push(r.n);
  });
  return out;
}
/* Nombres de los productos que usan una receta. */
function productosQueUsan(recKey){
  var out=[];
  Object.keys(ENSAMBLES).forEach(function(pk){
    var e=ENSAMBLES[pk];
    if((e.comp||[]).some(function(c){ return c[0]===recKey; })){
      var p=prod(pk); out.push(p?p.nombre:pk);
    }
  });
  return out;
}
function ingredientesOrdenados(){
  return Object.keys(INGREDIENTES).sort(function(a,b){
    return INGREDIENTES[a].n.localeCompare(INGREDIENTES[b].n,'es');
  });
}
function nEdit(x){ return Math.round(num(x)*1000)/1000; }   /* gramos legibles en inputs */
function guardarYRefrescar(){ guardarRecetas(); aplicarCosteoRecetas(); render('costeo'); }

/* ---------- EXPORTAR CSV ---------- */
function csvCosteo(){
  function q(s){ s=String(s==null?'':s); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
  var L=[];
  L.push('INGREDIENTES');
  L.push(['ingrediente','cantidad_compra','unidad','precio_compra','cop_por_g','fecha'].join(';'));
  Object.keys(INGREDIENTES).forEach(function(k){
    var i=INGREDIENTES[k];
    L.push([i.n, num(i.compra.c), i.compra.u, num(i.compra.p), copG(i).toFixed(4), i.fecha||''].map(q).join(';'));
  });
  L.push(''); L.push('RECETAS');
  L.push(['receta','ingrediente','ratio','gramos','cop_por_g','costo_linea'].join(';'));
  Object.keys(RECETAS).forEach(function(k){
    var rc=recetaCalc(k); if(!rc) return;
    rc.lineas.forEach(function(l){
      L.push([rc.r.n, l.ing.n, l.ratio, l.g.toFixed(2), l.cg.toFixed(4), l.costo.toFixed(2)].map(q).join(';'));
    });
    L.push([rc.r.n,'TOTAL','','crudo '+rc.crudo.toFixed(1)+' g','final '+rc.final.toFixed(1)+' g', rc.costo.toFixed(2)].map(q).join(';'));
  });
  L.push(''); L.push('PRODUCTOS');
  L.push(['producto','precio','ingredientes','merma','empaque','gas','mano_obra','costo_total','food_cost_%','margen'].join(';'));
  PRODUCTOS.forEach(function(p){
    var c=productoCalc(p.key); if(!c) return;
    L.push([p.nombre, p.precio, c.ing.toFixed(0), c.merma.toFixed(0), c.empaque, c.gas, c.labor,
            c.total.toFixed(0), c.fc.toFixed(1), c.margen.toFixed(0)].map(q).join(';'));
  });
  return L.join('\n');
}
function exportarCard(){
  var card=el('<div class="card"><h2>Exportar costeo</h2>'
    +'<div class="muted small" style="margin-bottom:6px">Genera un CSV con ingredientes, recetas y productos — para respaldo o para abrirlo en Excel.</div>'
    +'<div style="display:flex;gap:8px"><button class="btn oliva" id="cs-copy" style="flex:1">Copiar CSV</button>'
    +'<a class="btn primario" id="cs-dl" style="flex:1;width:auto">Descargar</a></div>'

  });
  return card;
}

      +'<button class="btn fant" data-cancel>Cancelar</button>'
      +'<button class="btn fant" data-del>Eliminar</button></div>'
      +'<div class="muted small" data-msg style="margin-top:6px"></div></div>');
    fila.appendChild(form);

    var iNom=form.querySelector('[data-nom]'), iC=form.querySelector('[data-c]'),
        iU=form.querySelector('[data-u]'), iP=form.querySelector('[data-p]'),
        iPU=form.querySelector('[data-puv]'), boxPU=form.querySelector('[data-pu]'),
        prev=form.querySelector('[data-prev]'), msg=form.querySelector('[data-msg]');
    function refrescar(){
      boxPU.style.display = iU.value==='u' ? 'block' : 'none';
      prev.textContent='= '+copG({compra:{c:iC.value,u:iU.value,p:iP.value}, pesoU:iPU.value}).toFixed(3)+' COP por gramo';
    }
    [iC,iU,iP,iPU].forEach(function(x){
      x.addEventListener('input', refrescar); x.addEventListener('change', refrescar);
    });
    refrescar();

    fila.addEventListener('click', function(ev){
      if(form.contains(ev.target)) return;
      form.style.display = form.style.display==='none' ? 'block' : 'none';
    });
    form.querySelector('[data-cancel]').addEventListener('click', function(){ form.style.display='none'; });
    form.querySelector('[data-save]').addEventListener('click', function(){
      var nombre=(iNom.value||'').trim();
      if(!nombre){ msg.textContent='El nombre no puede quedar vacío.'; return; }
      i.n=nombre;
      i.compra={c:num(iC.value), u:iU.value, p:num(iP.value)};
      if(iU.value==='u') i.pesoU=num(iPU.value); else delete i.pesoU;
      i.fecha=hoyISO();
      guardarYRefrescar();
    });
    form.querySelector('[data-del]').addEventListener('click', function(){
      var uso=recetasQueUsan(k);
      if(uso.length){
        msg.textContent='No se puede eliminar: lo usan '+uso.join(', ')+'. Quítalo de esas recetas primero.';
        return;
      }
      if(!confirm('¿Eliminar '+i.n+'?')) return;
      delete INGREDIENTES[k];
      guardarYRefrescar();
    });
    card.appendChild(fila);
  });
  main.appendChild(card);
}

      +'<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(rc.r.n)+' <span class="muted small">'+(ab?'▾':'▸')+'</span></div>'
      +'<div class="muted small">lote '+g(rc.crudo)+' crudo'
        +(rc.factor!==1 ? ' → '+g(rc.final)+' servido ('+Math.round((1-rc.factor)*100)+'% pérdida)' : '')
      +'</div></div>'
      +'<div style="text-align:right"><div class="money">'+rc.copGFinal.toFixed(2)+'</div>'
      +'<div class="muted small">COP/g servido</div></div></div>');

    if(ab){
